/* ---- Best-case balance -------------------------------------------------
   Redistributes ALL assigned loads (and then the future scenario) to even the
   panels out. Two passes:
     1. greedy descending  — largest load to the lightest panel
     2. local improvement  — try moving each load to another panel and keep the
        move only if it reduces the spread between panels
   Loads are not split. General lighting is treated as one load, so a very large
   single load can limit how even the result can be.
   Returns a summary so the change can be shown rather than applied silently. */
function bestCaseBalance(){
  const P=PLANS[ACTIVE], pans=panelsOf(P);
  const before=panelDistribution(P).map(o=>({name:o.name,connA:o.connA,util:o.util}));
  const items=P.loads.filter(r=>r.qty*r.va>0).slice().sort((a,b)=>b.qty*b.va-a.qty*a.va);
  const load={}; pans.forEach(pn=>load[pn.id]=0);
  const put=(r,id)=>{ r.panel=id; load[id]+=r.qty*r.va; };
  items.forEach(r=>{ let best=pans[0].id,bestPct=Infinity;
    pans.forEach(pn=>{const pct=load[pn.id]/240/pn.rating; if(pct<bestPct){bestPct=pct;best=pn.id;}});
    put(r,best); });
  const spread=()=>{const u=pans.map(pn=>load[pn.id]/240/pn.rating);return Math.max(...u)-Math.min(...u);};
  for(let pass=0;pass<3;pass++){
    let improved=false;
    items.forEach(r=>{
      const va=r.qty*r.va, from=r.panel, s0=spread();
      pans.forEach(pn=>{ if(pn.id===from)return;
        load[from]-=va; load[pn.id]+=va;
        if(spread()<s0-0.0001){ r.panel=pn.id; improved=true; }
        else { load[pn.id]-=va; load[from]+=va; }
      });
    });
    if(!improved)break;
  }
  P.futureManual={};                 /* a full rebalance clears manual pins */
  balanceFutureLoads(P);
  const after=panelDistribution(P).map(o=>({name:o.name,connA:o.connA,util:o.util}));
  const rep_={before,after,
    spreadBefore:Math.round((Math.max(...before.map(o=>o.util))-Math.min(...before.map(o=>o.util)))*100),
    spreadAfter:Math.round((Math.max(...after.map(o=>o.util))-Math.min(...after.map(o=>o.util)))*100)};
  P.balanceReport=rep_;
  const box=$("balreport");
  if(box){ box.style.display="block";
    box.innerHTML="<b>Best-case balance applied.</b><br>"
      + rep_.before.map((o,i)=>o.name+": "+Math.round(o.connA)+"A \u2192 <b>"+Math.round(rep_.after[i].connA)+"A</b>").join("<br>")
      + "<br>Spread "+rep_.spreadBefore+"% \u2192 <b>"+rep_.spreadAfter+"%</b>. Every assignment is still editable."; }
  renderRows(); renderFuture(); refresh();
  return rep_;
}
/* Classification-aware smart balance (Phase 3). Routes by load class, not just VA:
     Managed  -> SPAN (smart) panels, balanced.
     Protected + general single-pole -> standard (traditional) subpanels if present,
       otherwise they stay on the SPAN panel(s) as clearly non-managed loads.
     Other non-managed loads (e.g. a range, dryer) -> balanced across all panels.
   Respects each panel's rating via a greedy least-loaded pick within the target
   group. Proposes only; every assignment stays visible and editable. Distinguishes
   assigned connected load from calculated demand (panelDistribution is unchanged). */
function smartBalanceByClass(){
  const P=PLANS[ACTIVE], pans=panelsOf(P);
  if(!pans.length) return;
  const isSpan=pn=>panelSpec(pn).smart===true;
  const cap=pn=>pn.rating||panelSpec(pn).busRating||200;
  const spanP=pans.filter(isSpan), tradP=pans.filter(pn=>!isSpan(pn));
  const before=panelDistribution(P).map(o=>({name:o.name,connA:o.connA,util:o.util}));
  const items=P.loads.filter(r=>r.qty*r.va>0);
  const load={}; pans.forEach(pn=>load[pn.id]=0);
  const lightest=group=>{ let best=group[0],bp=Infinity; group.forEach(pn=>{const pct=load[pn.id]/240/cap(pn); if(pct<bp){bp=pct;best=pn;}}); return best; };
  const put=(r,pn)=>{ r.panel=pn.id; load[pn.id]+=r.qty*r.va; };
  const managedTargets=spanP.length?spanP:pans;
  const generalTargets=tradP.length?tradP:pans;
  const byVA=(a,b)=>b.qty*b.va-a.qty*a.va;
  const managed=items.filter(r=>r.managed).sort(byVA);
  const genProt=items.filter(r=>!r.managed&&(r.protected||isGeneralSinglePole(r))).sort(byVA);
  const rest=items.filter(r=>!r.managed&&!(r.protected||isGeneralSinglePole(r))).sort(byVA);
  managed.forEach(r=>put(r,lightest(managedTargets)));
  genProt.forEach(r=>put(r,lightest(generalTargets)));
  rest.forEach(r=>put(r,lightest(pans)));
  P.futureManual={}; balanceFutureLoads(P);
  const after=panelDistribution(P).map(o=>({name:o.name,connA:o.connA,util:o.util}));
  const note = (spanP.length&&!tradP.length)
      ? "No standard subpanel in this layout, so general single-pole and protected loads stayed on the SPAN panel(s). In the downstream architecture those live on a standard subpanel — add one to model it."
      : (!spanP.length ? "No SPAN managed panel in this layout, so managed loads were balanced across the available panels."
        : "Managed loads routed to the SPAN panel(s); general single-pole and protected loads to the standard subpanel(s).");
  P.balanceReport={before,after,note};
  const box=$("balreport");
  if(box){ box.style.display="block";
    box.innerHTML="<b>Smart balance by classification applied.</b><br>"
      + before.map((o,i)=>o.name+": "+Math.round(o.connA)+"A → <b>"+Math.round(after[i].connA)+"A</b>").join("<br>")
      + "<br>"+note+" Every assignment is still editable."; }
  renderRows(); renderFuture(); refresh();
  return P.balanceReport;
}

const SS_CATDEF={
 "General Lighting & Receptacles":{bk:"must",duty:0.4,coin:0.7},
 "Small Appliance & Laundry":{bk:"nice",duty:0.2,coin:0.6},
 "Cooking":{bk:"off",duty:0.1,coin:0.5},
 "Dryer":{bk:"off",duty:0.1,coin:0.5},
 "Fastened Appliances":{bk:"must",duty:0.3,coin:0.6},
 "Water Heating":{bk:"nice",duty:0.15,coin:0.5},
 "HVAC — Cooling":{bk:"nice",duty:0.45,coin:0.8},
 "HVAC — Heating":{bk:"nice",duty:0.45,coin:0.8},
 "HVAC — Air Handler":{bk:"nice",duty:0.45,coin:0.8},
 "EV & Continuous":{bk:"off",duty:0.1,coin:0.25,over:true},
 "Pool / Spa":{bk:"off",duty:0.1,coin:0.4},
 "Battery / ESS":{bk:"off",duty:0,coin:0},

function ssDefaults(r){
  const d=SS_CATDEF[r.cat]||{bk:"nice",duty:0.3,coin:0.6};
  if(r.bk===undefined)r.bk=d.bk;
  if(r.over===undefined)r.over=!!d.over;
  if(r.duty===undefined)r.duty=d.duty;
  if(r.coin===undefined)r.coin=d.coin;
  if(r.runKw===undefined)r.runKw=Math.round((r.qty*r.va/1000)*100)/100;
  /* Shed priority is a SEPARATE axis from essentiality (bk). It defaults from
     the class but is independently editable — e.g. a Nice-to-Have HVAC can be
     set to shed early because it is a big draw. Source marks whether the load
     value is a nameplate figure or an estimate. */
  if(r.shed===undefined)r.shed = r.over?"shed" : r.bk==="must"?"protect" : r.bk==="nice"?"cap" : "none";
  if(r.src===undefined)r.src="est";

}
/* Backfill rather than replace: a share link written by an earlier build can
   carry an ss object that is present but missing newer keys. Object.assign over
   a fresh default fills the gaps without discarding the user's saved values. */
function ssOf(p){ p.ss=Object.assign(SS_DEFAULT(),p.ss||{}); return p.ss; }
function ssSystem(p){
  const s=ssOf(p), svc=p.service||200;
  /* Gateways follow the number of SEPARATE battery systems, not the service
     size. One battery system = one gateway — a single 400 A service can run on
     one battery system + one gateway. A second gateway is required only when a
     second, separate battery system is added. */
  const gw=Math.max(1,(s.gwQty|0)||1);
  const sections=gw;
  const o={sections,gw,svc,notes:[]};
  if(s.battery==="pw3"){
    const pw=Math.max(1,s.pwQty|0), exp=Math.min(3*pw,Math.max(0,s.expQty|0));
    const unitA=+(s.pwOutA||48), unitKw=pw3UnitKw(unitA);
    o.mfg="Tesla"; o.batteryLabel="Tesla Powerwall 3"; o.ctrl="Gateway 3"; o.ctrlAmps=200; o.lra=185;
    o.kwh=(pw+exp)*13.5; o.kw=pw*unitKw; o.charge=exp>0?8:5; o.units=pw+exp; o.pwOutA=unitA;
    o.unitLabel=pw+" PW3"+(exp?" + "+exp+" Expansion":""); o.maxUnits=4*gw;
    o.notes.push("Powerwall 3 output set to "+unitA+" A / "+unitKw+" kW per unit (Tesla default 48 A / 11.5 kW; up to 4 PW3 per Gateway 3). Expansions add energy only.");
    if(pw>o.maxUnits)o.notes.push("PW3 count ("+pw+") exceeds 4 per gateway × "+gw+" gateway(s) — add a battery system / gateway or reduce units.");
  } else {
    const ap=Math.max(1,s.apQty|0), isS=s.battery==="apS";
    o.mfg="FranklinWH"; o.batteryLabel="FranklinWH "+(isS?"aPower S":"aPower 2"); o.ctrl="aGate"; o.ctrlAmps=160; o.ctrlKva=38.4; o.lra=185;
    o.kwh=ap*15; o.kw=Math.min(ap*10, 38.4*gw); o.charge=ap*8; o.units=ap;
    o.unitLabel=ap+" "+(isS?"aPower S":"aPower 2"); o.maxUnits=15*gw;
    o.notes.push("Franklin aGate continuous path is 160 A / 38.4 kVA (240 V) per aGate; up to 15 batteries / 225 kWh per aGate. Verify the 208 V real-power ceiling with Franklin.");
    if(isS)o.notes.push("aPower S is not publicly listed by SPAN as of the reference snapshot — verify integration before relying on SPAN backup features.");
    if(ap>o.maxUnits)o.notes.push("aPower count ("+ap+") exceeds 15 per aGate × "+gw+" gateway(s) — add a battery system / aGate.");
  }
  o.pathA=gw*o.ctrlAmps;
  if(svc>o.pathA) o.notes.push("Service ("+svc+" A) exceeds the combined gateway path ("+gw+" × "+o.ctrlAmps+" A = "+o.pathA+" A). Only loads routed through the gateway(s) are backed up — the rest of the service is not part of backup. Add a battery system / gateway for full-service coverage.");
  o.contKw = (s.outputOverride!==""&&s.outputOverride!=null) ? +s.outputOverride : o.kw;
  return o;
}
function ssRuntime(p){
  const sys=ssSystem(p), s=ssOf(p);
  const live=p.loads.filter(r=>r.qty*r.va>0); live.forEach(ssDefaults);
  const exp=r=>r.runKw*r.duty*r.coin, run=r=>r.runKw;
  const inclA=live.filter(r=>!r.over&&(r.bk==="must"||r.bk==="nice"));
  const inclB=live.filter(r=>!r.over&&r.bk==="must");
  const expA=inclA.reduce((t,r)=>t+exp(r),0), expB=inclB.reduce((t,r)=>t+exp(r),0);
  const runA=inclA.reduce((t,r)=>t+run(r),0);
  const usable=sys.kwh, soc=Math.min(1,(s.socPct||100)/100), reserve=(s.reservePct||0)/100, mid=0.5;
  /* Two-tier depletion: comfort loads (Must+Nice) run in band A from the start
     SOC down to the 50% crossover, then essentials (Must) run in band B from the
     crossover down to the reserve. The crossover must be clamped between reserve
     and the start SOC — otherwise a partial start (SOC<50%) or a high reserve
     (>50%) lets a band draw energy the battery does not physically hold, which
     over-states runtime on the customer-facing headline. Clamped, the two bands
     can never sum to more than usable*(soc-reserve). */
  const midEff=Math.min(soc,Math.max(reserve,mid));
  const eA=Math.max(0,usable*(soc-midEff)), eB=Math.max(0,usable*(midEff-reserve));
  const pv=Math.max(0,s.pvAvgKw||0);
  const hA=expA>0?eA/expA:Infinity, hB=expB>0?eB/expB:Infinity;
  const hApv=expA>0?eA/Math.max(0.05,expA-pv):Infinity, hBpv=expB>0?eB/Math.max(0.05,expB-pv):Infinity;
  const totNoPV=(isFinite(hA)?hA:0)+(isFinite(hB)?hB:0);
  const totPV=(isFinite(hApv)?hApv:0)+(isFinite(hBpv)?hBpv:0);
  return {sys,expA,expB,runA,usable,eA,eB,hA,hB,totNoPV,totPV,pv,midEff,powerMargin:sys.contKw-runA,soc,reserve,countA:inclA.length,countB:inclB.length};
}

   PHASE 5 — BACKUP OUTLOOK (simple front end over the storage engine)
   POWER view, amperage-first: system amps at 240 V (kW·1000/240, so 24 kW = 100A),

function ssBackupOutlook(){

/* Simultaneous-operation screen: protected base + the big managed loads,

function ssSimScreen(){

  const protA=live.filter(r=>r.bk==="must").reduce((t,r)=>t+opA(r),0);

  else { const keep=[]; let run=protA; bigs.forEach(r=>{ if(run+opA(r)<=outputA){run+=opA(r);keep.push(r);} });

function ssInterconnect(sys){
  const s=SSP.ss;
  const busbar=Math.max(0,+s.busbarA||225);
  const main=Math.max(0,+s.mainA||0);
  const pvA=Math.max(0,+s.pvInvA||0);
  const battAuto=sys?Math.round(sys.contKw*1000/240):0;
  const battAutoUsed=(s.battInvA===""||s.battInvA==null);
  const battA=battAutoUsed?battAuto:Math.max(0,+s.battInvA);
  /* Points of connection: 705.12 is applied per busbar / per point of connection.
     Multiple separate battery systems (one gateway each) can land at their own
     points; with "pergw" the battery backfeed is evaluated per point rather than
     summed onto a single busbar. Balanced distribution across points is assumed
     and disclosed — subject to AHJ and the actual busbar/main at each point. */
  const gw=Math.max(1,(sys&&sys.gw)||1);
  const perGw=(s.battPts==="pergw");
  const pts=perGw?gw:1;
  const battPerPoint=pts>1?battA/pts:battA;
  const backfeed=pvA+battA;                 // total, single-busbar view
  const backfeedPoint=pvA+battPerPoint;     // governing point-of-connection view
  const allow120=1.2*busbar;
  const load120=main+backfeed;
  const load120Point=main+backfeedPoint;
  const govLoad=perGw?load120Point:load120;
  const pass120=govLoad<=allow120+1e-6;
  const passSum=(main+(perGw?backfeedPoint:backfeed))<=busbar+1e-6;
  return {busbar,main,pvA,battA,battAuto,battAutoUsed,backfeed,backfeedPoint,
    allow120,load120,load120Point,govLoad,pass120,passSum,gw,pts,perGw,
    headroom:allow120-govLoad,method:(s.icMethod||"loadside")};
}

         ["Backup scope",SSP.backupScope==='partial'?"Essential loads":"Whole home"],
         ["PV (STC)",sol?((SSP.ss.pvKwStc||0)+" kW"):"None"],
         ["Runtime model","Diversified kW = run \u00d7 duty \u00d7 coincidence; staged full \u2192 50% (Must+Nice) \u2192 reserve (Must-only)"]
       ].map(r=>`<tr><td class="lk">${r[0]}</td><td class="lv">${r[1]}</td></tr>`).join("")}</tbody></table></div>
     <div class="sec"><div style="font-size:10.5px;color:var(--grey);line-height:1.5;border-top:1px solid var(--line);padding-top:10px">${(stor?sys.notes:["Solar-only screening: interconnection per NEC 705.12 — confirm busbar / main and utility rules."]).map(n=>"• "+n).join("<br>")}<br>• Screening / design-discussion model only. Confirm latest manufacturer revision, utility interconnection, AHJ, service-equipment listing, conductor / OCPD sizing, and load calcs before release. SPAN is not the Engineer of Record.</div></div>
    </section>`;
  }
  box.innerHTML=toggle+doc;
}

<script>

/* ---------- Builder Design Review prototype UI (v3) ---------- */
let SLD=null;
const g = id => document.getElementById(id);
function num(id,d){ const v=parseFloat((g(id)||{}).value); return isNaN(v)?d:v; }
function val(id){ return (g(id)||{}).value; }
function chk(id){ return !!(g(id)||{}).checked; }
function editionForState(st){ const s=STATES[st]; const m=((s&&s.nec)||"").match(/(20\d\d)/); const y=m?m[1]:"2020"; return NEC_RULES[y]?y:"2020"; }
function stateMandate(st){ return ((STATES[st]||{}).mandate)||""; }
function isTitle24(st){ return /title\s*24/i.test(stateMandate(st)); }
function populateStates(){ const sel=g('state'); if(!sel||sel.dataset.filled) return;
  Object.keys(STATES).sort().forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=k; sel.appendChild(o); });
  sel.value="California"; sel.dataset.filled="1"; }

const ADU_VA={studio:6000,br1:9000,br2:12000};
const ADU_LABEL={studio:"Studio ADU",br1:"1-bedroom ADU",br2:"2-bedroom ADU"};

function opts(){
  return { allElectric: val('svctype')==='allelec', heat: val('heat'), stripKw: num('stripkw',10),
    ewh: chk('ewh'), ev: Math.max(0,Math.round(num('ev',0))),
    adu: val('adu'), pool: chk('pool'), spa: chk('spa'), shop: chk('shop'),
    dblOven: chk('dbloven'), steamer: chk('steamer'), floorHeat: chk('floorheat'), outHeat: chk('outheat'),
    ss: val('ss') };
}
function buildLoads(sqft,o){
  const L=[];
  L.push({cat:"General Lighting & Receptacles",desc:"General lighting + receptacles",qty:sqft,va:lightingUnitVA(),glauto:true});
  L.push({cat:"Small Appliance & Laundry",desc:"Small-appliance circuits",qty:2,va:1500,volts:120});
  L.push({cat:"Small Appliance & Laundry",desc:"Laundry circuit",qty:1,va:1500,volts:120});
  if(o.allElectric){ L.push({cat:"Cooking",desc:"Electric range",qty:1,va:12000,volts:240,ocpd:50});
    L.push({cat:"Dryer",desc:"Electric dryer",qty:1,va:5000,volts:240,ocpd:30}); }
  if(o.dblOven) L.push({cat:"Cooking",desc:"Double wall oven",qty:1,va:8000,volts:240,ocpd:40});
  L.push({cat:"Fastened Appliances",desc:"Dishwasher",qty:1,va:1500,volts:120,ocpd:20});
  L.push({cat:"Fastened Appliances",desc:"Disposal",qty:1,va:900,volts:120,ocpd:20});
  L.push({cat:"Fastened Appliances",desc:"Microwave",qty:1,va:1800,volts:120,ocpd:20});
  L.push({cat:"Fastened Appliances",desc:"Refrigerator",qty:1,va:800,volts:120,ocpd:20});
  if(o.ewh) L.push({cat:"Water Heating",desc:"Electric water heater",qty:1,va:4500,volts:240,ocpd:30,managed:true});
  if(o.heat==='hp'){ const sys="hp1";
    L.push({cat:"HVAC — Heat Pump System",desc:"Heat-pump compressor",qty:1,va:5000,volts:240,ocpd:30,sys,sysName:"Heat pump",role:"compressor"});
    L.push({cat:"HVAC — Heat Pump System",desc:"Electric backup / strips",qty:1,va:(o.stripKw||10)*1000,volts:240,ocpd:60,sys,sysName:"Heat pump",role:"backup",managed:true});
    L.push({cat:"HVAC — Heat Pump System",desc:"Air handler",qty:1,va:800,volts:240,ocpd:20,sys,sysName:"Heat pump",role:"ah"});
  } else if(o.heat==='elec'){
    L.push({cat:"HVAC — Cooling",desc:"AC condenser",qty:1,va:6000,volts:240,ocpd:40});
    L.push({cat:"HVAC — Heating",desc:"Electric furnace / strips",qty:1,va:(o.stripKw||10)*1000,volts:240,ocpd:60,managed:true});
    L.push({cat:"HVAC — Air Handler",desc:"Air handler",qty:1,va:800,volts:240,ocpd:20});
  } else { L.push({cat:"HVAC — Cooling",desc:"AC condenser",qty:1,va:6000,volts:240,ocpd:40});
    L.push({cat:"HVAC — Air Handler",desc:"Blower",qty:1,va:600,volts:120,ocpd:15}); }
  for(let i=0;i<o.ev;i++) L.push({cat:"EV & Continuous",desc:"Level 2 EV charger",qty:1,va:11520,volts:240,ocpd:60,managed:true,cont:true});
  if(o.adu && o.adu!=='none') L.push({cat:"Other / Custom",desc:ADU_LABEL[o.adu]+" (managed subpanel)",qty:1,va:ADU_VA[o.adu],volts:240,ocpd:60,managed:true,est:true});
  if(o.pool) L.push({cat:"Pool / Spa",desc:"Pool equipment",qty:1,va:5000,volts:240,ocpd:50,managed:true,est:true});
  if(o.spa)  L.push({cat:"Pool / Spa",desc:"Spa / hot tub",qty:1,va:9600,volts:240,ocpd:50,managed:true,est:true});
  if(o.steamer) L.push({cat:"Other / Custom",desc:"Steam shower / steamer",qty:1,va:7000,volts:240,ocpd:40,managed:true,est:true});
  if(o.floorHeat) L.push({cat:"Other / Custom",desc:"Electric floor heat",qty:1,va:5000,volts:240,ocpd:30,managed:true,est:true});
  if(o.outHeat) L.push({cat:"Other / Custom",desc:"Outdoor / patio heat",qty:1,va:5000,volts:240,ocpd:30,managed:true,est:true});
  if(o.shop) L.push({cat:"Other / Custom",desc:"Workshop / garage subpanel",qty:1,va:5000,volts:240,ocpd:50,managed:true,est:true});
  return L;
}
function planCalc(sqft,o,target,pct){
  METHOD="optional"; PCT=pct;
  const c=calc({name:"p",sqft,service:target,loads:buildLoads(sqft,o),future:{},panels:null,futurePanel:{}});
  const before=Math.ceil(c.calcA), floor=Math.ceil(c.floorA), setpt=Math.round(target*pct/100);
  return {before,floor,setpt,holds:c.floorA<=setpt+0.01,
    pctBefore:Math.round(c.calcA/target*100),pctFloor:Math.round(c.floorA/target*100),
    headroom:Math.max(0,100-Math.round(c.floorA/target*100)), c};
}
function svcWithout(d,t){ if(d<=t)return t+"A"; if(d<=400)return "320 / 400A"; if(d<=480)return "400A"; return "600A"; }
const rng={ev:"40-60A",adu:"40-60A",pool:"20-40A",spa:"50-60A",ewh:"30A",strip:"30-50A",shop:"30-50A",steam:"40-50A",floor:"20-40A",out:"20-40A"};
function discretionary(o){
  const r=[];
  if(o.ev) r.push(["EV charging",rng.ev,"High","Minimal","Charge time is flexible, so a brief throttle is invisible to the homeowner."]);
  if(o.adu&&o.adu!=='none') r.push([ADU_LABEL[o.adu],rng.adu,"Medium","Minimal","Second-unit loads rarely peak with the main home, so the shared service absorbs them."]);
  if(o.pool) r.push(["Pool equipment",rng.pool,"High","Minimal","Pumps already cycle on a schedule, so a managed cycle goes unnoticed."]);
  if(o.spa) r.push(["Spa / hot tub",rng.spa,"High","Minimal","Heat is retained for hours, so a short pause has no thermal impact."]);
  if(o.steamer) r.push(["Steam shower / steamer",rng.steam,"High","Minimal","Short sessions on demand, so a brief pause goes unnoticed."]);
  if(o.floorHeat) r.push(["Electric floor heat",rng.floor,"Medium","Minimal","Thermal mass holds heat, so managed cycling is invisible."]);
  if(o.outHeat) r.push(["Outdoor / patio heat",rng.out,"High","Minimal","Comfort heat used occasionally, easily deferred at peak."]);
  if(o.ewh) r.push(["Electric water heater",rng.ewh,"High","Minimal","The tank stores heat, so managed cycles are invisible to the user."]);
  if(o.heat==='hp'||o.heat==='elec') r.push(["Supplemental heat / strips",rng.strip,"Medium","Minimal","Active only at temperature extremes, so primary heating stays untouched."]);
  if(o.shop) r.push(["Workshop / garage sub",rng.shop,"High","Minimal","Discretionary tool use, rarely active during the evening peak."]);
  return r;
}
function loadChips(o){ const c=[];
  if(o.heat==='hp') c.push("Heat pump + backup strips"); else if(o.heat==='elec') c.push("Electric furnace / strips"); else c.push("Gas heat, electric AC");
  if(o.allElectric) c.push("Electric range + dryer");
  if(o.dblOven) c.push("Double oven"); if(o.ewh) c.push("Electric water heater");
  if(o.ev) c.push(o.ev+" EV charger"+(o.ev>1?"s":""));
  if(o.adu&&o.adu!=='none') c.push(ADU_LABEL[o.adu]);
  if(o.pool) c.push("Pool"); if(o.spa) c.push("Spa");
  if(o.steamer) c.push("Steam shower"); if(o.floorHeat) c.push("Floor heat"); if(o.outHeat) c.push("Outdoor heat"); if(o.shop) c.push("Workshop sub");
  const ssL={opt:"Solar optional",ready:"Solar ready",ss_ready:"Solar + storage ready",ss_incl:"Solar + storage included"}[o.ss];
  if(ssL) c.push(ssL); return c;
}
function capBar(p,target){ const fl=Math.min(100,p.pctFloor), set=Math.round((p.setpt/target)*100), over=p.pctBefore>100;
  return '<div class="cap"><div class="cap-bar"><div class="cap-mgd" style="left:'+fl+'%;width:'+Math.max(0,set-fl)+'%"></div>'
   +'<div class="cap-floor" style="width:'+fl+'%"></div><div class="cap-set" style="left:'+set+'%"></div></div>'
   +'<div class="cap-row"><span><b style="color:var(--green)">'+p.pctFloor+'%</b> of '+target+'A used with SPAN</span><span><b>'+p.headroom+'%</b> headroom for future loads</span></div>'
   +'<div class="cap-row dim"><span>Before SPAN: '+p.before+'A = <b style="color:'+(over?'var(--red)':'var(--green)')+'">'+p.pctBefore+'%</b>'+(over?' (over the '+target+'A service)':'')+'</span><span>Setpoint '+set+'%</span></div></div>'; }
function A(n){return n+"A";}
function kwv(va){ return (va/1000).toFixed(2); }
function calcTable(p,edition){
  const c=p.r.c;
  const rows=c.rows.filter(r=>r[2]!=null && r[2]>0);
  const body=rows.map(r=>'<tr><td class="l">'+r[0]+'</td><td>'+(r[1]?kwv(r[1]):"—")+'</td><td><b>'+kwv(r[2])+'</b></td><td class="ref">'+(r[3]||"")+'</td></tr>').join("");
  return '<div class="tw"><table class="calc"><thead><tr><th>Load group</th><th>Connected kW</th><th>NEC demand kW</th><th>Reference</th></tr></thead><tbody>'+body
   +'<tr class="tot"><td class="l">Total calculated demand</td><td>'+kwv(c.rawConnectedVA)+'</td><td><b>'+kwv(c.unitTotalVA)+'</b></td><td></td></tr>'
   +'<tr class="tot2"><td class="l">Calculated demand at 240V</td><td colspan="3"><b>'+p.r.before+'A</b> · optional method (220.82) · NEC '+edition+'</td></tr>'
   +'</tbody></table></div>';
}
function render(){
  populateStates();
  const st=val('state')||"California"; EDITION=editionForState(st);
  const edL=g('edlabel'); if(edL) edL.textContent="NEC "+EDITION+(/\(|amend/i.test((STATES[st]||{}).nec||"")?" (state amended)":"");
  const t24=isTitle24(st), mandate=stateMandate(st);
  const o=opts();
  const sqft=Math.max(0,Math.round(num('sqft',2400))), beds=Math.max(0,Math.round(num('beds',3)));
  const target=Math.round(num('target',200)), pct=Math.max(1,Math.round(num('pct',80)));
  const bsmt=chk('bsmt'), bsmtSf=Math.max(0,Math.round(num('bsmtsf',1000)));
  const builder=val('builder')||"Builder, Community", market=val('market')||st, utility=val('utility')||"Utility", prepby=val('prepby')||"", planName=val('pname')||"Base plan";
  const plans=[{name:planName,sqft,role:"Smallest"}];
  if(bsmt) plans.push({name:(val('pname2')||"Largest, finished basement"),sqft:sqft+bsmtSf,role:"Largest"});
  plans.forEach(p=>{ p.r=planCalc(p.sqft,o,target,pct); p.without=svcWithout(p.r.before,target); });
  const worst=plans.reduce((a,b)=>b.r.before>a.r.before?b:a);
  const holdsAll=plans.every(p=>p.r.holds), disc=discretionary(o), chips=loadChips(o);
  const red="var(--red)",green="var(--green)", bottomBefore=worst.r.before, beforeColor=bottomBefore>target?red:green;
  const ssReady={opt:"offered as a solar option",ready:"solar ready",ss_ready:"solar and storage ready",ss_incl:"solar and storage included"}[o.ss]||"future loads";
  const futureCopy = o.ss==='ss_incl' ? "Solar and storage are installed and managed by SPAN on the existing service." : "EV, solar, battery, and ADU additions absorbed by the existing service ("+ssReady+").";
  const outcomes=[["Reduced upgrade cost","Fewer 320A and 400A class installs across the portfolio."],["Standardized design","One electrical strategy across plans and communities."],["Reduced utility friction","Fewer transformer and coordination requests per build."],["Future ready",futureCopy]];
  const t24note = t24 ? '<div class="t24"><b>California, Title 24.</b> New single-family homes require solar PV and, in most climate zones, battery storage readiness, and the current cycle makes heat pump space and water heating the baseline. With NEM 3.0, storage is increasingly needed to capture solar value. That stacks electric load onto the service, which is where SPAN manages the home on one service. Subject to climate zone, code cycle, and AHJ.</div>' : '';

  const planCard=p=>'<div class="pcard"><div class="pc-top"><div class="pc-role">'+p.role+' plan</div><div class="pc-name">'+p.name+'</div><div class="pc-sf">'+p.sqft.toLocaleString()+' sq ft · '+beds+' bed</div></div>'
   +'<div class="pc-chips">'+chips.map(c=>'<span>'+c+'</span>').join("")+'</div>'
   +'<div class="pc-svc"><span>Calculated demand before SPAN</span><b style="color:'+(p.r.before>target?red:green)+'">'+A(p.r.before)+'</b></div>'
   +'<div class="pc-svc dim"><span>Service without SPAN</span><b>'+p.without+'</b></div><div class="pc-cap">'+capBar(p.r,target)+'</div></div>';
  const stratRow=p=>'<div class="srow"><div class="s-plan"><div class="s-role">'+p.role+'</div><div class="s-name">'+p.name+'</div><div class="s-sf">'+p.sqft.toLocaleString()+' sq ft</div></div>'
   +'<div class="s-box red"><div class="s-big">'+p.without+'</div><div class="s-lab">Existing design strategy</div></div>'
   +'<div class="s-box green"><div class="s-big">'+(p.r.holds?A(target):A(p.r.floor))+'</div><div class="s-lab">'+(p.r.holds?"SPAN may support staying at "+A(target)+" · "+p.r.pctFloor+"% used *":"Non-managed floor *")+'</div></div></div>';

  const sldBlock = SLD
    ? '<figure class="sldfig"><img src="'+SLD+'" alt="Single line diagram"><figcaption>Single line diagram as provided. SPAN supports all current and future loads, '+ssReady+'. SPAN comms require Cat5e or greater from the router to SPAN.</figcaption></figure>'
    : '<div class="sld"><div class="sld-ph"><div><b>Create the single line diagram</b><br><a class="sldbtn" href="https://picker.app.span.io/sld/index.html" target="_blank" rel="noopener">Open SLD Creator</a><br><label class="sldup">Attach SLD image<input type="file" id="sldfile" accept="image/*" hidden></label><br><span class="dim">Build it in the creator, export the image, then attach it here. This connection carries over from the tool.</span></div></div>'
      +'<div class="sld-note">SPAN supports all current and future loads, '+ssReady+'. SPAN comms require Cat5e or greater from the router location to SPAN.</div></div>';

  g('out').innerHTML =
   '<div class="doc"><div class="cover"><div class="cov-mark">SPAN</div><div class="cov-sub">Design Review</div><h1 class="cov-h">'+builder+'</h1>'
   +'<div class="cov-meta">'+plans.map(p=>p.sqft.toLocaleString()).join(" and ")+' sq ft · target '+A(target)+' service · '+st+'</div>'
   +'<div class="cov-by">'+(prepby?("Prepared by "+prepby+" · "):"")+'NEC '+EDITION+' · '+(mandate||"")+' · 2026</div>'
   +'<div class="exbadge">Example design review · preliminary · not the engineer of record</div></div>'
   +'<section><div class="eyebrow">Bottom line</div><div class="bottom"><div class="bl-nums">'
   +'<div class="bl-one"><div class="bl-big" style="color:'+beforeColor+'">'+A(bottomBefore)+'</div><div class="bl-cap">Calculated demand before SPAN'+(bottomBefore>target?" (over "+A(target)+")":"")+'<br><span class="dim">Optional method, NEC '+EDITION+'</span></div></div>'
   +'<div class="bl-one"><div class="bl-big" style="color:'+green+'">'+A(target)+'</div><div class="bl-cap">With SPAN documented as the EMS (NEC 750)'+(holdsAll?"":" *")+'<br><span class="dim">'+worst.r.pctFloor+'% of the '+A(target)+' used, '+worst.r.headroom+'% headroom</span></div></div></div>'
   +'<div class="why"><div class="why-h">Why this matters</div><p>All electric readiness means the service has to be sized for everything, even where gas is installed day one.</p>'
   +'<p>Heat pump backup strips, electric water heating, EV charging, and options like an ADU stack past '+A(target)+' on '+(plans.length>1?"both plans":"this plan")+'.</p>'
   +'<p>The default outcome without SPAN is a '+svcWithout(Math.max(target+1,bottomBefore),target)+' service upgrade, a CT cabinet, larger conductors, and a utility review.</p>'+t24note+'</div></div></section>'
   +'<section><div class="eyebrow">Before SPAN</div><div class="pgrid">'+plans.map(planCard).join("")+'</div>'
   +'<div class="basis"><div><span>Utility and market</span><b>'+utility+' · '+market+'</b></div><div><span>Code basis</span><b>'+st+' · NEC '+EDITION+' · '+(mandate||"EMS under Article 750")+'</b></div></div></section>'
   +'<section><div class="eyebrow">Service size strategy and builder outcome</div><div class="strat-head"><div></div><div class="sh red">Without SPAN</div><div class="sh green">With SPAN</div></div>'
   +plans.map(stratRow).join("")+'<div class="outcomes">'+outcomes.map(x=>'<div class="oc"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join("")+'</div>'
   +'<div class="fine">* Subject to AHJ approval and utility acceptance. SPAN supports dynamic load management under NEC Article 750. Final service rating depends on plan-specific design review and final engineering review.</div></section>'
   +(disc.length?'<section><div class="eyebrow">Not every load runs at once</div><p class="sintro">The discretionary loads pushing service above '+A(target)+', and how SPAN may manage them.</p>'
     +'<div class="tw"><table class="disc"><thead><tr><th>Load</th><th>Typical demand</th><th>Shed priority</th><th>Homeowner impact</th><th>Why it is a good candidate</th></tr></thead><tbody>'
     +disc.map(r=>'<tr><td class="l">'+r[0]+'</td><td>'+r[1]+'</td><td><span class="pill">'+r[2]+'</span></td><td><span class="pill ok">'+r[3]+'</span></td><td class="reason">'+r[4]+'</td></tr>').join("")
     +'</tbody></table></div><div class="fine">Typical demand ranges are illustrative industry values. Project-specific loads depend on a plan-specific design review. Final service rating is subject to AHJ approval and utility acceptance.</div></section>':'')
   +'<section><div class="eyebrow">Single line outcome</div>'+sldBlock+'</section>'
   +'<section><div class="eyebrow">Example design review calculation</div><p class="sintro">The '+worst.role.toLowerCase()+' plan ('+worst.name+'), optional method, with managed loads removed from the non-managed floor by SPAN.</p>'
   +calcTable(worst,EDITION)+'<div class="fine">Example only, not a stamped calculation. Managed loads are controlled by SPAN, not removed. Final load calculation and service rating are subject to the engineer of record, AHJ approval, and utility acceptance.</div></section>'
   +'</div>';

  const fi=g('sldfile'); if(fi) fi.addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{SLD=rd.result; render();}; rd.readAsDataURL(f); });
}
document.addEventListener('input',e=>{ if(e.target.closest('.rail')) render(); });
document.addEventListener('change',e=>{ if(e.target.closest('.rail')) render(); });
render();

</script>
