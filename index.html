<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Builder Design Review — prototype</title><style>
:root{--bg:#0f1210;--rail:#141815;--line:#283029;--fg:#e9efea;--muted:#9fb0a6;--accent:#22c55e;--accent-d:#15a34a;
 --doc:#ffffff;--ink:#14201a;--dmut:#5c6b62;--dline:#e4e9e5;--red:#dc2b55;--green:#15a34a;--amber:#b4791a;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px}
.app{display:grid;grid-template-columns:380px 1fr;min-height:100vh}
@media(max-width:860px){.app{grid-template-columns:1fr}}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:16px 16px 60px;overflow:auto}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.brand b{font-size:18px;letter-spacing:.12em}.brand span{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ptag{font-size:11px;color:var(--amber);background:#2a2113;border:1px solid #4a3a1a;border-radius:6px;padding:4px 8px;margin:8px 0 14px;display:inline-block}
.grp{border-top:1px solid var(--line);padding:14px 0 4px}
.grp h4{margin:0 0 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.fld{margin-bottom:9px}.fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select{width:100%;background:#0e1310;border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:8px 9px;font-size:13px;font-family:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ck{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);padding:5px 0;cursor:pointer}
.ck input{accent-color:var(--accent);width:16px;height:16px}
.adu{background:#12271c;border:1px solid #1f5f3a;border-radius:8px;padding:9px 10px;margin-bottom:8px}
.adu label{color:var(--accent)}
.hint{font-size:10.5px;color:var(--muted);margin-top:3px}.edtag{font-size:11px;color:var(--accent);margin-top:4px}
.stage{overflow:auto;background:#eceeec;padding:26px}
.doc{max-width:900px;margin:0 auto;background:var(--doc);color:var(--ink);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.18);overflow:hidden}
.cover{background:#0f1512;color:#fff;padding:34px 40px 30px}
.cov-mark{font-weight:800;letter-spacing:.2em;font-size:22px}.cov-sub{color:var(--accent);font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-top:2px}
.cov-h{font-size:34px;margin:18px 0 6px;font-weight:800;letter-spacing:-.01em}.cov-meta{color:var(--accent);font-weight:700;font-size:15px}
.cov-by{color:#9fb0a6;font-size:12px;margin-top:8px}
.exbadge{display:inline-block;margin-top:16px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#cbd5cf;border:1px solid #2c3630;border-radius:999px;padding:4px 10px}
section{padding:24px 40px;border-top:1px solid var(--dline)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-d);font-weight:700;margin-bottom:12px}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:26px}@media(max-width:720px){.bottom{grid-template-columns:1fr}}
.bl-nums{display:flex;flex-direction:column;gap:18px}.bl-big{font-size:60px;font-weight:800;line-height:.9;letter-spacing:-.03em}
.bl-cap{font-size:12.5px;color:var(--dmut);margin-top:6px;line-height:1.4}
.why{background:#f4f6f4;border:1px solid var(--dline);border-radius:10px;padding:16px 18px}
.why-h{font-weight:700;color:var(--dmut);text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-bottom:8px}
.why p{margin:0 0 9px;font-size:13.5px;line-height:1.5}
.t24{margin-top:10px;background:#fdf6e3;border:1px solid #e8dca8;border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:10px 12px;font-size:12.5px;line-height:1.5;color:#5a4a1e}
.dim{color:var(--dmut)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.pcard{border:1px solid var(--dline);border-radius:10px;overflow:hidden}
.pc-top{background:#0f1512;color:#fff;padding:12px 14px}
.pc-role{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.pc-name{font-weight:700;font-size:15px;margin-top:1px}.pc-sf{color:#9fb0a6;font-size:12px}
.pc-chips{display:flex;flex-wrap:wrap;gap:5px;padding:12px 14px 6px}
.pc-chips span{font-size:10.5px;background:#eef2ef;border:1px solid var(--dline);border-radius:999px;padding:3px 8px;color:#39463f}
.pc-svc{display:flex;justify-content:space-between;align-items:baseline;padding:7px 14px;font-size:12.5px}
.pc-svc b{font-size:20px;font-weight:800}.pc-svc.dim{border-top:1px solid var(--dline);color:var(--dmut)}.pc-svc.dim b{font-size:14px;color:var(--ink)}
.pc-cap{padding:10px 14px 14px;border-top:1px solid var(--dline)}
.cap-bar{position:relative;height:16px;border-radius:5px;background:#eef2ef;border:1px solid var(--dline);overflow:hidden}
.cap-floor{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
.cap-mgd{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#bfe6cc,#bfe6cc 4px,#d6efde 4px,#d6efde 8px)}
.cap-set{position:absolute;top:-2px;bottom:-2px;border-left:2px dashed #14201a}
.cap-row{display:flex;justify-content:space-between;font-size:11px;margin-top:6px}.cap-row.dim{color:var(--dmut);margin-top:3px}
.basis{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.basis>div{background:#f4f6f4;border:1px solid var(--dline);border-radius:8px;padding:10px 12px}
.basis span{display:block;font-size:10.5px;color:var(--dmut);text-transform:uppercase;letter-spacing:.06em}.basis b{font-size:13px}
.strat-head{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px;margin-bottom:8px}
.sh{text-align:center;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.sh.red{color:var(--red)}.sh.green{color:var(--green)}
.srow{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px;margin-bottom:10px;align-items:stretch}
.s-plan{background:#0f1512;color:#fff;border-radius:9px;padding:12px 14px}
.s-role{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.s-name{font-weight:700;font-size:14px}.s-sf{color:#9fb0a6;font-size:12px}
.s-box{border-radius:9px;padding:12px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.s-box.red{background:#fde7ee;border:1px solid #f5bcd0}.s-box.green{background:#e7f6ee;border:1px solid #b6e0c7}
.s-big{font-size:26px;font-weight:800;line-height:1}.s-box.red .s-big{color:var(--red)}.s-box.green .s-big{color:var(--green)}
.s-lab{font-size:10.5px;margin-top:4px}.s-box.red .s-lab{color:#9b2947}.s-box.green .s-lab{color:#1a6b43}
.outcomes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:16px}
.oc{border:1px solid var(--dline);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px}
.oc b{display:block;font-size:13px;margin-bottom:3px}.oc span{font-size:12px;color:var(--dmut);line-height:1.4}
.fine{font-size:10.5px;color:var(--dmut);margin-top:12px;line-height:1.45}
.sintro{font-size:13.5px;color:var(--dmut);margin:0 0 12px}
.tw{overflow-x:auto}
table.disc,table.calc{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
table.disc th,table.calc th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dmut);padding:7px 8px;border-bottom:2px solid var(--dline)}
table.disc td,table.calc td{padding:9px 8px;border-bottom:1px solid var(--dline);vertical-align:top}
table.disc td.l,table.calc td.l{font-weight:700}table.disc td.reason{color:var(--dmut)}
table.calc td.ref{color:var(--dmut);font-size:11px}
table.calc tr.tot td{border-top:2px solid var(--dline);font-weight:700}
table.calc tr.tot2 td{background:#f4f6f4}
.pill{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:#fde7ee;color:#9b2947}.pill.ok{background:#e7f6ee;color:#1a6b43}
.sld{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}@media(max-width:720px){.sld{grid-template-columns:1fr}}
.sld-ph{border:2px dashed var(--dline);border-radius:10px;min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dmut);font-size:13px;line-height:1.7;padding:14px}
.sldbtn{display:inline-block;margin:8px 0;background:var(--accent-d);color:#fff;text-decoration:none;border-radius:7px;padding:8px 14px;font-weight:700;font-size:13px}
.sldup{display:inline-block;margin-top:4px;color:var(--accent-d);font-weight:700;cursor:pointer;text-decoration:underline}
.sld-note{background:#f4f6f4;border:1px solid var(--dline);border-radius:10px;padding:14px;font-size:12.5px;color:#39463f;line-height:1.5}
.sldfig{margin:0;border:1px solid var(--dline);border-radius:10px;padding:10px;background:#fff}
.sldfig img{max-width:100%;display:block;margin:0 auto;border-radius:6px}
.sldfig figcaption{font-size:11px;color:var(--dmut);margin-top:8px;text-align:center}
</style></head><body>
<div class="app">
  <aside class="rail">
    <div class="brand"><b>SPAN</b><span>Design Review</span></div>
    <div class="ptag">Builder Design Review · prototype v3</div>
    <div class="grp"><h4>Project</h4>
      <div class="fld"><label>Builder / community</label><input id="builder" value="Aspen Ridge, Series 40"></div>
      <div class="row2"><div class="fld"><label>State (drives the code)</label><select id="state"></select></div><div class="fld"><label>Market / region</label><input id="market" placeholder="auto from state"></div></div>
      <div class="row2"><div class="fld"><label>Utility</label><input id="utility" value="PG&E"></div><div class="fld"><label>Prepared by</label><input id="prepby" placeholder="your name"></div></div>
      <div class="edtag" id="edlabel"></div></div>
    <div class="grp"><h4>Base plan</h4>
      <div class="fld"><label>Plan name</label><input id="pname" value="Plan 2010"></div>
      <div class="row3"><div class="fld"><label>Square feet</label><input id="sqft" type="number" value="2400"></div><div class="fld"><label>Bedrooms</label><input id="beds" type="number" value="3"></div><div class="fld"><label>Baths</label><input id="baths" type="number" value="2.5" step="0.5"></div></div>
      <div class="row2"><div class="fld"><label>Target service</label><select id="target"><option>200</option><option>320</option><option>400</option></select></div><div class="fld"><label>PowerUp setpoint %</label><input id="pct" type="number" value="80"></div></div></div>
    <div class="grp"><h4>Larger plan</h4>
      <label class="ck"><input type="checkbox" id="bsmt" checked> Finished basement (the larger / optional plan)</label>
      <div class="row2"><div class="fld"><label>Basement adds (sq ft)</label><input id="bsmtsf" type="number" value="1000"></div><div class="fld"><label>Larger plan name</label><input id="pname2" value="Plan 2010 + basement"></div></div></div>
    <div class="grp"><h4>What is in the home</h4>
      <div class="fld"><label>Service type</label><select id="svctype"><option value="allelec">All electric</option><option value="gas">Gas day one</option></select></div>
      <div class="fld"><label>Heating</label><select id="heat"><option value="hp">Heat pump + electric backup strips</option><option value="elec">Electric furnace / strips</option><option value="gas">Gas furnace (electric AC only)</option></select></div>
      <div class="fld"><label>Backup / strip heat (kW)</label><input id="stripkw" type="number" value="10"></div>
      <label class="ck"><input type="checkbox" id="ewh" checked> Electric water heater</label>
      <div class="fld"><label>EV chargers</label><input id="ev" type="number" value="1" min="0"></div></div>
    <div class="grp"><h4>Future and optional loads</h4>
      <div class="adu"><div class="fld" style="margin:0"><label>ADU (accessory dwelling unit)</label><select id="adu"><option value="none">None</option><option value="studio">Studio ADU</option><option value="br1">1-bedroom ADU</option><option value="br2">2-bedroom ADU</option></select></div></div>
      <label class="ck"><input type="checkbox" id="dbloven"> Double oven</label>
      <label class="ck"><input type="checkbox" id="steamer"> Steam shower / steamer</label>
      <label class="ck"><input type="checkbox" id="floorheat"> Electric floor heat</label>
      <label class="ck"><input type="checkbox" id="outheat"> Outdoor / patio heat</label>
      <label class="ck"><input type="checkbox" id="pool"> Pool</label>
      <label class="ck"><input type="checkbox" id="spa"> Spa / hot tub</label>
      <label class="ck"><input type="checkbox" id="shop"> Workshop / garage subpanel</label>
      <div class="fld" style="margin-top:8px"><label>Solar and storage</label><select id="ss"><option value="none">None</option><option value="opt">Solar optional</option><option value="ready">Solar ready</option><option value="ss_ready" selected>Solar + storage ready</option><option value="ss_incl">Solar + storage included</option></select></div>
      <div class="hint">The state sets the code. The checklist builds the load profile, and the real design review engine computes every number.</div></div>
  </aside>
  <main class="stage"><div id="out"></div></main>
</div>
<script>

/* =======================================================
   STATE MATRIX (SPAN_State_Pitch_Matrix.xlsx, May 2026)
   ======================================================= */
const STATES={
"Alabama":{nec:"2017",eff:"2020",mandate:"None statewide",batt:"Tornado / Gulf storm backup",pitch:"Low-Med"},
"Alaska":{nec:"2020",eff:"2020",mandate:"Renewable Energy Fund",batt:"Off-grid + outage resilience",pitch:"Low"},

"Arkansas":{nec:"2017",eff:"2017",mandate:"None",batt:"Tornado backup",pitch:"Low"},
"California":{nec:"2020 (CEC 2022 amendments)",eff:"2023",mandate:"Title 24 solar+storage; NEM 3.0",batt:"PSPS + NEM 3.0 + TOU + SGIP",pitch:"HIGHEST"},

"Illinois":{nec:"2020 (Chicago=CEC)",eff:"2022",mandate:"CEJA 100% clean 2050; storage rebate",batt:"ComEd/Ameren rates + IL Shines",pitch:"Med-High"},
"Indiana":{nec:"2008 (residential, lagging)",eff:"2017",mandate:"None",batt:"Storm/tornado",pitch:"Low"},
"Iowa":{nec:"2020",eff:"2022",mandate:"None significant",batt:"Tornado + derecho memory",pitch:"Low-Med"},
"Kansas":{nec:"2017 (no statewide)",eff:"Varies",mandate:"None",batt:"Tornado backup",pitch:"Low"},
"Kentucky":{nec:"2020",eff:"2022",mandate:"None",batt:"Tornado + Ford BlueOval growth",pitch:"Low-Med"},
"Louisiana":{nec:"2017",eff:"2018",mandate:"Climate Action Plan (advisory)",batt:"Hurricane + Entergy outages (Ida)",pitch:"HIGH"},
"Maine":{nec:"2023",eff:"2024",mandate:"175k more heat pumps by 2027; 100% clean 2050",batt:"Storm + grid stress",pitch:"HIGH"},
"Maryland":{nec:"2020",eff:"2023",mandate:"Climate Solutions Now 60% by 2031",batt:"Storm + TOU pilots",pitch:"Med-High"},
"Massachusetts":{nec:"2023",eff:"Jan 2024",mandate:"Net-Zero Stretch Code; Specialized Opt-In",batt:"Storm + ConnectedSolutions",pitch:"HIGH"},
"Michigan":{nec:"2017",eff:"2021",mandate:"100% clean by 2040",batt:"Ice storms + utility outages",pitch:"Med"},
"Minnesota":{nec:"2020",eff:"2023",mandate:"Carbon-free electricity by 2040",batt:"Cold-weather backup + Xcel TOU",pitch:"Med"},
"Mississippi":{nec:"2017",eff:"Varies",mandate:"None",batt:"Hurricane / tornado",pitch:"Low-Med"},
"Missouri":{nec:"2017 (no statewide)",eff:"Varies",mandate:"None significant",batt:"Tornado / storms",pitch:"Low"},
"Montana":{nec:"2023",eff:"2024",mandate:"None",batt:"Wildfire growing",pitch:"Low"},
"Nebraska":{nec:"2020",eff:"2023",mandate:"None",batt:"Tornado + TOU emerging",pitch:"Low"},
"Nevada":{nec:"2020",eff:"2022",mandate:"RPS 50% by 2030",batt:"Heat + NV Energy TOU/demand",pitch:"HIGH"},
"New Hampshire":{nec:"2020",eff:"2022",mandate:"Limited; Eversource voluntary",batt:"Ice-storm backup",pitch:"Med"},

"New Mexico":{nec:"2023",eff:"2024",mandate:"Energy Transition Act 100% by 2045",batt:"Wildfire + heat",pitch:"Med"},
"New York":{nec:"2020 (NYC amendments)",eff:"2020",mandate:"CLCPA; All-Electric Building Act (<7 stories 2026)",batt:"NYSERDA + utility programs + storm",pitch:"HIGHEST"},
"North Carolina":{nec:"2017",eff:"2018",mandate:"HB 951 — Duke 70% by 2030",batt:"Hurricane + EV growth",pitch:"Med"},
"North Dakota":{nec:"2023",eff:"2024",mandate:"None",batt:"Cold-weather backup",pitch:"Low"},
"Ohio":{nec:"2017 (RCO)",eff:"2018",mandate:"None significant",batt:"Derecho + utility outages",pitch:"Med"},
"Oklahoma":{nec:"2020",eff:"2023",mandate:"None",batt:"Tornado / ice storm",pitch:"Low-Med"},
"Oregon":{nec:"2023",eff:"2023",mandate:"HB 2021 100% clean 2040; reach codes",batt:"PSPS + wildfire",pitch:"HIGH"},
"Pennsylvania":{nec:"2017 (some AHJ 2020)",eff:"Varies",mandate:"Climate Action Plan (advisory)",batt:"Storm + utility outages",pitch:"Med"},
"Rhode Island":{nec:"2020",eff:"2023",mandate:"Act on Climate 100% renewable 2033",batt:"Storm + National Grid programs",pitch:"Med-High"},
"South Carolina":{nec:"2023",eff:"2024",mandate:"Limited; utility voluntary",batt:"Hurricane + grid resilience",pitch:"Med"},
"South Dakota":{nec:"2017",eff:"2018",mandate:"None",batt:"Tornado",pitch:"Low"},
"Tennessee":{nec:"2020",eff:"2022",mandate:"None",batt:"Storm + EV plants",pitch:"Low-Med"},
"Texas":{nec:"2020",eff:"2023",mandate:"None statewide (REP market)",batt:"ERCOT events + TOU",pitch:"HIGH"},
"Utah":{nec:"2020",eff:"2023",mandate:"Limited; utility voluntary",batt:"Wildfire + heat",pitch:"Med"},
"Vermont":{nec:"2020",eff:"2023",mandate:"Clean Heat Standard; heat-pump rebates",batt:"GMP Bring-Your-Own-Device VPP",pitch:"HIGH"},
"Virginia":{nec:"2020 (VUSBC)",eff:"2021",mandate:"VCEA 100% renewable by 2050",batt:"Storm + Dominion TOU",pitch:"Med"},
"Washington":{nec:"2023",eff:"2024",mandate:"CETA 100% clean 2045; heat-pump preference",batt:"PSPS + wildfire + storm",pitch:"HIGH"},
"West Virginia":{nec:"2020",eff:"2022",mandate:"None",batt:"Storm backup",pitch:"Low"},
"Wisconsin":{nec:"2017",eff:"2018",mandate:"Limited",batt:"Storm + ice",pitch:"Low-Med"},
"Wyoming":{nec:"2017",eff:"2018",mandate:"None",batt:"Wildfire emerging",pitch:"Low"}
};
const PITCHC={"HIGHEST":"#0CB560","HIGH":"#0a9a52","Med-High":"#00B0D3","Med":"#6F7070","Low-Med":"#9AA0A0","Low":"#B7BCBC"};

/* =========================================================
   NEC_RULES[edition][...] — centralized, edition-specific.
   verify:true  => not confirmed against the code book; UI must show VERIFY.
   Never render a section number from another edition.
   ========================================================= */
const NEC_RULES={
 "2020":{ label:"2020 NEC", article:"220", chapter:"Chapter 2",
   optional:{ sec:"220.82", name:"Optional (dwelling)" },
   standard:{ sec:"220 Part III", name:"Standard (dwelling)" },
   lightingUnitVA:3, lightingUnit:"220.12", lighting:"220.42",   /* reviewed Aug 2026 */
   appliances:"220.53", dryer:"220.54", range:"220.55",
   noncoincident:"220.60",
   ems:"750.30(C)", evse:"625.42", pcs:null, verify:false, confirmed:[] },
 "2023":{ label:"2023 NEC", article:"220", chapter:"Chapter 2",
   optional:{ sec:"220.82", name:"Optional (dwelling)" },
   standard:{ sec:"220 Part III", name:"Standard (dwelling)" },
   lightingUnitVA:3, lightingUnit:"220.41", lighting:"220.45",   /* 2023 renumbering reviewed Aug 2026 */
   appliances:"220.53", dryer:"220.54", range:"220.55",
   noncoincident:"220.60",
   ems:"750.30", evse:"625.42", evseCalc:"220.57", pcs:"705.13", verify:false, confirmed:[] },
 "2026":{ label:"2026 NEC", article:"120", chapter:"Chapter 1",
   optional:{ sec:"120.82", name:"Optional (dwelling)" },
   standard:{ sec:"120 Part III", name:"Standard (dwelling)" },
   lightingUnitVA:2, lightingUnit:"120.41", lighting:"120.45",
   appliances:"120.53", dryer:"120.54", range:"120.55",
   noncoincident:"120.60",
   ems:"750.30", evse:"625.42", pcs:"705.13", verify:true,
   confirmed:["optional","lightingUnit","lightingUnitVA"],
   note:"2026 NEC relocated the load-calculation rules from Article 220 (Chapter 2) into Article 120 (Chapter 1). Confirmed: 120.82 optional dwelling and the general lighting unit load reduced to 2 VA/ft\u00b2 at 120.41. Remaining Article 120 section numbers are mapped by analogy and REQUIRE VERIFICATION." }
};
let EDITION="2020";
let METHOD="optional";
const R=()=>NEC_RULES[EDITION];
/* section ref helper: appends VERIFY when the mapping is unconfirmed */
function ref(key){
  const r=R(); let v=r[key];
  if(v&&typeof v==="object")v=v.sec;

  const circuits=cs.map((c,i)=>({cid:pnId+"_"+i,desc:c.desc,amps:c.amps,poles:c.poles,va:c.va,mgd:!!c.mgd,locked:false,pos:0,loadRef:c.loadRef,expanded:!!c.expanded}));
  const map=packInGroupOrder(circuits,spaces,new Set());
  circuits.forEach(c=>c.pos=map[c.cid]);
  schedStore(plan)[pnId]={circuits,undo:[],spaces};
  return schedStore(plan)[pnId];
}
function occMap(sched){ const m={}; sched.circuits.forEach(c=>{ m[c.pos]=c.cid; if(c.poles===2)m[c.pos+2]=c.cid; }); return m; }

/* Find a circuit anywhere in the plan's panel schedules (it may live on a panel
   other than the drop target — that is a cross-panel move). */
function findCircuit(plan,cid){ const st=schedStore(plan); for(const pid in st){ const c=st[pid].circuits.find(x=>x.cid===cid); if(c)return{pnId:pid,sched:st[pid],c}; } return null; }
/* Move to an empty target, or swap with a single compatible occupant on the same
   panel. Dropping onto a DIFFERENT panel relocates the circuit there (and, for a
   dedicated circuit that maps 1:1 to a load, reassigns that load's panel so the
   calculation and metrics follow). Never splits a 2-pole; respects locks. */
function schedMove(plan,pnId,cid,pos){
  const tgt=schedOf(plan,pnId); if(!tgt)return{ok:false,msg:"No schedule"};
  const src=findCircuit(plan,cid); if(!src)return{ok:false,msg:"Circuit not found"};
  const c=src.c;
  if(c.locked)return{ok:false,msg:c.desc+" is locked"};
  const spaces=tgt.spaces||42;
  if(pos<1||pos>spaces)return{ok:false,msg:"Off the panel"};
  if(c.poles===2 && pos+2>spaces)return{ok:false,msg:"Two-pole breaker doesn't fit there"};
  const targetPos = c.poles===2?[pos,pos+2]:[pos];
  /* ---- cross-panel relocation ---- */
  if(src.pnId!==pnId){
    const om=occMap(tgt), occ=new Set(); targetPos.forEach(p=>{ if(om[p])occ.add(om[p]); });
    if(occ.size>0)return{ok:false,msg:"Drop on an open position to move "+c.desc+" to this panel"};
    pushUndo(src.sched); pushUndo(tgt);
    src.sched.circuits=src.sched.circuits.filter(x=>x.cid!==cid);
    c.pos=pos; tgt.circuits.push(c);
    /* Reassign the underlying load's panel for a dedicated (non-expanded) circuit
       so the calc/metrics follow; expanded room circuits (general lighting,
       small-appliance) stay a schedule-only move and reset on Regenerate. */
    let note="";
    if(!c.expanded && c.loadRef!=null && plan.loads[c.loadRef]){ plan.loads[c.loadRef].panel=pnId; }
    else if(c.expanded){ note=" (layout only \u2014 resets on Regenerate)"; }
    return {ok:true,msg:"Moved "+c.desc+" to this panel"+note};
  }
  /* ---- same-panel move / swap ---- */
  const om=occMap(tgt), occ=new Set();
  targetPos.forEach(p=>{ if(om[p]&&om[p]!==cid)occ.add(om[p]); });
  if(occ.size===0){ pushUndo(tgt); c.pos=pos; return{ok:true,msg:"Moved "+c.desc}; }
  if(occ.size>1)return{ok:false,msg:"That would overlap more than one breaker"};
  const d=tgt.circuits.find(x=>x.cid===[...occ][0]);
  if(d.locked)return{ok:false,msg:d.desc+" is locked"};
  if(d.poles!==c.poles)return{ok:false,msg:"Can't swap a "+(c.poles===2?"two-pole":"one-pole")+" with a "+(d.poles===2?"two-pole":"one-pole")};
  const cOld=c.pos;
  if(d.poles===2 && cOld+2>spaces)return{ok:false,msg:"Swap would push a two-pole off the panel"};
  pushUndo(tgt); c.pos=pos; d.pos=cOld;
  return{ok:true,msg:"Swapped "+c.desc+" \u2194 "+d.desc};
}
function schedLock(plan,pnId,cid){ const s=schedOf(plan,pnId), c=s&&s.circuits.find(x=>x.cid===cid); if(c){ pushUndo(s); c.locked=!c.locked; return c.locked; } }

  s.circuits.forEach(c=>{ if(by[c.cid]){c.pos=by[c.cid].pos;c.locked=by[c.cid].locked;} }); return true; }

   moves a locked circuit, and it previews before/after (Apply is a user action).

function schedBalance(plan,pnId){

  const spaces=s.spaces||42;

  const movable=s.circuits.filter(c=>c.poles===1&&!c.locked);
  if(movable.length<2)return null;
  const fixedPos=new Set(); fixed.forEach(c=>{ fixedPos.add(c.pos); if(c.poles===2)fixedPos.add(c.pos+2); });
  let baseA=0,baseB=0;
  fixed.forEach(c=>{ if(c.poles===2){baseA+=c.va/2;baseB+=c.va/2;} else { if(legOf(c.pos)==="A")baseA+=c.va; else baseB+=c.va; } });
  const availA=[],availB=[];
  for(let p=1;p<=spaces;p++){ if(fixedPos.has(p))continue; (legOf(p)==="A"?availA:availB).push(p); }

    else if(!wantA&&capB>0){legFor[c.cid]="B";B+=c.va;capB--;}
    else if(capA>0){legFor[c.cid]="A";A+=c.va;capA--;}
    else {legFor[c.cid]="B";B+=c.va;capB--;} });

function groupRank(desc){ const d=(desc||"").toLowerCase();

  if(/kitchen|small.?appliance|refriger|fridge|dishwash|disposal|microwave|dining/.test(d))return 1;
  if(/bedroom|primary|living|family|office|general|house light/.test(d))return 2;
  if(/bath|laundry|washer|garage|exterior|porch|smoke|utility/.test(d))return 3;

  const map=packInGroupOrder(s.circuits, s.spaces||42, lockedCids);

let ONELINE=null;   /* {url,name,w,h,type,size} */
const OL_OK=["image/png","image/jpeg","image/jpg","image/webp"];
function olError(msg){ const e=$("olerr"); if(!msg){e.style.display="none";return;} e.style.display="block"; e.innerHTML=msg; }
function olLoadFile(f){
  if(!f)return;
  if(f.type==="application/pdf"){
    olError("<b>PDF not supported in the report.</b> Rendering a PDF page would require an external library, which would compromise this tool being a single self-contained file. Export the sheet as PNG or JPG and drop it here.");
    return;
  }
  if(OL_OK.indexOf(f.type)<0){
    olError("<b>Unsupported file type"+(f.type?" ("+f.type+")":"")+".</b> Use PNG, JPG or WebP.");
    return;
  }
  olError(null);
  const rd=new FileReader();
  rd.onload=()=>{
    const url=rd.result;
    /* Show the diagram immediately; the pixel-dimension probe is a non-blocking
       enhancement so a failed probe can never hide a valid image. */
    ONELINE={url,name:f.name||"diagram",w:null,h:null,type:f.type,size:f.size||0};
    renderOneLine(); refresh();
    try{
      const img=new Image();
      img.onload=()=>{ if(ONELINE&&ONELINE.url===url){ ONELINE.w=img.naturalWidth; ONELINE.h=img.naturalHeight; renderOneLine(); } };
      img.src=url;
    }catch(err){/* dimensions are cosmetic only */}
  };
  rd.onerror=()=>olError("<b>File could not be read.</b>");
  rd.readAsDataURL(f);
}
function olRemove(){ ONELINE=null; olError(null); renderOneLine(); refresh(); }
function renderOneLine(){
  const drop=$("oldrop"), prev=$("olprev");
  if(!ONELINE){ drop.style.display="block"; prev.style.display="none"; prev.innerHTML=""; return; }
  drop.style.display="none"; prev.style.display="block";
  const kb=ONELINE.size?Math.round(ONELINE.size/1024)+" KB":"";
  const dim=(ONELINE.w&&ONELINE.h)?ONELINE.w+"\u00d7"+ONELINE.h+" px ":"";
  prev.innerHTML=`<img src="${ONELINE.url}" alt="one-line preview">
    <div class="olmeta"><span>${ONELINE.name}</span><span>${dim}${kb}</span></div>
    <div class="olbtns"><button onclick="$('olfile').click()">Replace</button><button class="rm" onclick="olRemove()">Remove</button></div>`;
}
function wireOneLine(){
  const drop=$("oldrop"), file=$("olfile");
  drop.onclick=()=>file.click();
  file.onchange=e=>{ olLoadFile(e.target.files&&e.target.files[0]); file.value=""; };
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();drop.classList.remove("over");}));
  drop.addEventListener("drop",e=>{ const dt=e.dataTransfer; if(dt&&dt.files&&dt.files.length)olLoadFile(dt.files[0]); });
  /* clipboard paste anywhere except while typing in a field */
  document.addEventListener("paste",e=>{
    const t=e.target&&e.target.tagName;
    if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA")return;
    const items=(e.clipboardData&&e.clipboardData.items)||[];
    for(const it of items){ if(it.type&&it.type.indexOf("image/")===0){ const f=it.getAsFile(); if(f){ olLoadFile(f); e.preventDefault(); return; } } }
  });
}

   ======================================================= */
const sc=(loads,cat)=>loads.filter(r=>r.cat===cat).reduce((s,r)=>s+r.qty*r.va,0);
/* ---------- shared bucket extraction (raw connected VA) ---------- */
/* ---------- Heat-pump / geothermal systems (NEC 220.60 noncoincident) ----------
   A heat-pump system uses ONE compressor for both heating and cooling, so its
   heating and cooling values are never added to each other. Electric backup /
   aux heat supplements the compressor IN HEATING MODE, so it is coincident with
   the compressor there. The governing contribution per system is:
       heatingMode = compressor + backup + air handler
       coolingMode = compressor + air handler
       governing   = max(heatingMode, coolingMode)
   Independent systems are then SUMMED (each takes its own larger-of-heat/cool);
   heating and cooling of the SAME system are never summed. Rows are grouped by
   r.sys; role is r.role (compressor | backup | ah). This is additive: simple
   split systems entered under HVAC — Cooling/Heating/Air Handler are untouched
   and still flow through the legacy larger-of term in the engines. */
function hvacSystems(L){
  const m={};
  L.forEach(r=>{
    if(r.cat!=="HVAC — Heat Pump System")return;
    const va=r.qty*r.va; if(va<=0)return;
    const id=r.sys||"hp";
    const s=m[id]||(m[id]={id, name:r.sysName||("HVAC system "+id),
      comp:0,compMgd:0, backup:0,backupMgd:0, ah:0,ahMgd:0});
    const role=r.role||"compressor";
    const mgd=!!r.managed && hpRoleManageable(role);
    if(role==="backup"){ s.backup+=va; if(mgd)s.backupMgd+=va; }
    else if(role==="ah"){ s.ah+=va; }
    else { s.comp+=va; if(mgd)s.compMgd+=va; }
  });
  return Object.keys(m).map(k=>{
    const s=m[k];
    const heatMode=s.comp+s.backup+s.ah;
    const coolMode=s.comp+s.ah;
    const heatGoverns=heatMode>=coolMode;               // true whenever backup>0
    const gov=Math.max(heatMode,coolMode);
    const govMgd=heatGoverns ? (s.compMgd+s.backupMgd) : s.compMgd;  // managed share of the governing mode (ah never managed)
    const conn=s.comp+s.backup+s.ah;
    return {...s, heatMode, coolMode, heatGoverns, gov, govMgd, conn};
  });
}
function buckets(L){
  L.forEach(r=>{ if(r.managed&&!mgdEligible(r.cat))r.managed=false; });
  const nameplate=r=>r.qty*r.va;
  const sumN=cat=>L.filter(r=>r.cat===cat).reduce((s,r)=>s+nameplate(r),0);
  const catMgd=cat=>L.filter(r=>r.cat===cat&&r.managed).reduce((s,r)=>s+nameplate(r),0);
  const HP=hvacSystems(L);
  return {
    lighting: sumN("General Lighting & Receptacles"),
    smallAppl: sumN("Small Appliance & Laundry"),
    cooking: sumN("Cooking"), cookingRows: L.filter(r=>r.cat==="Cooking"),
    dryer: sumN("Dryer"),
    fastened: sumN("Fastened Appliances"),
    fastenedCount: L.filter(r=>r.cat==="Fastened Appliances"&&r.qty*r.va>0).length,
    waterMgd: L.filter(r=>r.cat==="Water Heating"&&r.managed).reduce((s,r)=>s+nameplate(r),0),
    waterUnmgd: L.filter(r=>r.cat==="Water Heating"&&!r.managed).reduce((s,r)=>s+nameplate(r),0),
    cool: sumN("HVAC — Cooling"), heat: sumN("HVAC — Heating"), ah: sumN("HVAC — Air Handler"),
    coolMgd: catMgd("HVAC — Cooling"), heatMgd: catMgd("HVAC — Heating"),
    hpSystems: HP,
    hpGov: HP.reduce((t,s)=>t+s.gov,0),
    hpGovMgd: HP.reduce((t,s)=>t+s.govMgd,0),
    hpConn: HP.reduce((t,s)=>t+s.conn,0),
    evCont: sumN("EV & Continuous")+sumN("Pool / Spa"),
    evContMgd: catMgd("EV & Continuous")+catMgd("Pool / Spa"),
    other: sumN("Other / Custom")+sumN("Battery / ESS"),
    otherMgd: catMgd("Other / Custom")+catMgd("Battery / ESS")

}
/* Table 220.55 Column C, counted as SEPARATE appliances.
   COL_C[n] = demand kW for n ranges/ovens each over 1.75 kW through 12 kW.
   Values reviewed and confirmed by SPAN SE (Master Electrician), Aug 2026.
   Column C applies only to units OVER 1.75 kW through 12 kW: units at or below
   COOK_MIN are excluded from the count and added at nameplate instead, so a small
   countertop appliance cannot inflate the appliance count. Units over 12 kW carry a
   per-unit adder (single-appliance Note treatment applied inside a multi-unit count
   is a tool construction, disclosed on the output). */
const COOK_MIN=1750;
const COL_C={1:8,2:11,3:14,4:17,5:20,6:21,7:22,8:23,9:24,10:25,11:26,12:27};
function colC(n){ if(n<=0)return 0; if(COL_C[n])return COL_C[n]*1000;
  return (27+(n-12))*1000; }
/* rows = cooking load rows. count = sum of qty (each unit is one appliance).
   Any single unit over 12 kW gets the Note 1 style adder, flagged for verification. */
function cookingDemand(rows){
  let count=0, over=0, small=0, smallN=0;
  rows.forEach(r=>{ const q=Math.max(0,Math.round(r.qty||0)); if(q<=0||r.va<=0)return;
    if(r.va<=COOK_MIN){ small+=q*r.va; smallN+=q; return; }   /* outside Column C scope */
    count+=q;
    const kW=r.va/1000;
    if(kW>12) over += q*400*Math.ceil(kW-12);
  });
  if(count<=0&&small<=0)return {dem:0,count:0,over:0,small:0,smallN:0};
  return {dem:colC(count)+over+small,count,over,small,smallN};
}
/* HVAC output-row label: reflects heat-pump / geothermal 220.60 handling when present. */
function hvacLabel(b){
  const hasSplit=(b.cool+b.heat+b.ah)>0, hasHP=(b.hpConn||0)>0;
  if(hasHP&&hasSplit) return "HVAC — heat pump / geo (220.60 per system) + split (larger of heat / cool)";
  if(hasHP) return "HVAC — heat pump / geothermal (220.60: compressor + backup heating, larger vs cooling)";
  return "HVAC (larger of heat / cool + air handler)";
}
/* ---------- STANDARD (Article 220 Part III / 2026 Art.120) ---------- */
function engineStandard(b){
  const genGroup=b.lighting+b.smallAppl;
  const genDem = genGroup<=3000 ? genGroup
    : genGroup<=120000 ? 3000+(genGroup-3000)*0.35
    : 3000+117000*0.35+(genGroup-120000)*0.25;
  const CK=cookingDemand(b.cookingRows);
  const cookDem=CK.dem;
  /* Water heating grouped with fastened-in-place appliances and subject to the
     4-or-more 75% factor. Confirmed as common practice for a preliminary review;
     SPAN is not the Engineer of Record. Disclosed in Verification / Open Items. */
  const fastGroup=b.fastened+b.waterUnmgd+b.waterMgd;
  const fastCount=b.fastenedCount+((b.waterUnmgd+b.waterMgd)>0?1:0);
  const fastFactor=fastCount>=4?0.75:1;
  const fastDem=fastGroup*fastFactor;
  const dryDem=b.dryer>0?Math.max(b.dryer,5000):0;
  /* HVAC term = legacy larger-of (simple split systems) + heat-pump/geothermal
     systems, each governed per 220.60 (see hvacSystems). Independent terms sum. */
  const hvacLegacy=Math.max(b.cool,b.heat)+b.ah;
  const hvacDem=hvacLegacy+b.hpGov;
  const contDem=b.evCont*1.25;
  const genDemVA=genDem+cookDem+fastDem+dryDem+b.other;
  const unitTotal=genDemVA+hvacDem+contDem;
  /* EMS-controllable demand removed from the non-managed floor, driven per load by
     the PwrUp flag: continuous @125%, managed water at its group factor, the managed
     share of the governing (non-coincident) HVAC term, and managed other / ESS. */
  const contMgdDem=b.evContMgd*1.25;
  const gov=Math.max(b.cool,b.heat);
  const govMgdFrac=b.cool>=b.heat?(b.cool>0?b.coolMgd/b.cool:0):(b.heat>0?b.heatMgd/b.heat:0);
  const hvacMgdDem=gov*govMgdFrac + b.hpGovMgd;
  const waterMgdDem=b.waterMgd*fastFactor;
  const mgdDem=contMgdDem+hvacMgdDem+waterMgdDem+b.otherMgd;
  return {rows:[
      ["General lighting ("+lightingUnitVA()+" VA/ft\u00b2) + small appliance / laundry", genGroup, genDem, ref("lightingUnit")+" / "+ref("lighting")],
      ["Cooking equipment ("+CK.count+" appliance"+(CK.count===1?"":"s")+", Column C)", b.cooking, cookDem, ref("range")],
      ["Fastened appliances + water heating", fastGroup, fastDem, ref("appliances")],
      ["Clothes dryer", b.dryer, dryDem, ref("dryer")],
      [hvacLabel(b), b.cool+b.heat+b.ah+b.hpConn, hvacDem, ref("noncoincident")],
      ["Continuous loads (EV charger / pool) @125%", b.evCont, contDem, ref("evse")],
      ["Other", b.other, b.other, null]
    ],
    genDemVA:genDemVA, hvacVA:hvacDem, contSubVA:contDem,
    cont25:b.evCont*0.25, mgdContVA:mgdDem, nonMgdVA:unitTotal-mgdDem};
}
/* ---------- OPTIONAL (220.82 / 2026 120.82) ---------- */
function engineOptional(b){
  const pool=b.lighting+b.smallAppl+b.cooking+b.dryer+b.fastened+b.waterUnmgd+b.waterMgd+b.other;
  const optDem=x=>x<=10000?x:10000+(x-10000)*0.40;
  const genDem=optDem(pool);
  /* HVAC @ 100% under 220.82(C): legacy larger-of split systems + heat-pump/geo
     systems each governed per 220.60. Independent terms sum. */
  const hvacDem=Math.max(b.cool,b.heat)+b.ah+b.hpGov;
  const contDem=b.evCont*1.25;
  const unitTotal=genDem+hvacDem+contDem;
  /* Floor = demand from unmanaged loads only, driven per load by the PwrUp flag.
     Managed general items (water, ESS / other) leave the general pool; managed
     continuous and the managed governing-HVAC share leave their groups. */
  const poolUnmgd=pool-b.waterMgd-b.otherMgd;
  const genDemFloor=optDem(poolUnmgd);
  const contMgdDem=b.evContMgd*1.25;
  const gov=Math.max(b.cool,b.heat);
  const govMgdFrac=b.cool>=b.heat?(b.cool>0?b.coolMgd/b.cool:0):(b.heat>0?b.heatMgd/b.heat:0);
  const hvacMgdDem=gov*govMgdFrac + b.hpGovMgd;
  const nonMgdVA=genDemFloor+(hvacDem-hvacMgdDem)+(contDem-contMgdDem);
  const mgdDem=unitTotal-nonMgdVA;
  return {rows:[
      ["General load pool (nameplate, excl. HVAC + continuous)", pool, genDem, ref("optional")],
      ["  first 10 kVA @ 100%, remainder @ 40%", null, null, ref("optional")],
      [hvacLabel(b)+" @ 100%", b.cool+b.heat+b.ah+b.hpConn, hvacDem, ref("optional")],
      ["Continuous loads (EV charger / pool) @125%", b.evCont, contDem, ref("evse")]
    ],
    genDemVA:genDem, hvacVA:hvacDem, contSubVA:contDem,
    cont25:b.evCont*0.25, mgdContVA:mgdDem, nonMgdVA:nonMgdVA};
}
function calc(plan){
  const V=240, L=plan.loads, service=plan.service, setA=service*(PCT/100);
  const b=buckets(L);
  const E = METHOD==="standard" ? engineStandard(b) : engineOptional(b);
  const rawConnectedVA = b.lighting+b.smallAppl+b.cooking+b.dryer+b.fastened
      +b.waterMgd+b.waterUnmgd+b.cool+b.heat+b.ah+b.hpConn+b.evCont+b.other;
  const generalConnVA = b.lighting+b.smallAppl+b.cooking+b.dryer+b.fastened+b.waterUnmgd+b.other;
  const genDemVA=E.genDemVA, hvacVA=E.hvacVA, contSubVA=E.contSubVA, cont25=E.cont25;
  const managedContinuousVA=E.mgdContVA;
  const unitTotalVA = genDemVA+hvacVA+contSubVA;
  const calcA = unitTotalVA/V;
  const floorA = E.nonMgdVA/V;                // non-managed floor (managed loads excluded)
  const holdsService = setA<=service;          // setpoint fits the service (always true, but explicit)
  const emsDoesWork = calcA>setA;              // EMS is actually reducing the submission
  const floorOK = floorA<=setA;                // SPAN can truly hold at setpoint
  const overService = calcA>service;           // without EMS, exceeds the firm service
  // future scenario
  let futAddNonMgd=0, futAddMgd=0, futList=[], futNon=[], futMgd=[];
  FUTURE.forEach(f=>{ if(plan.future[f.id]){ futList.push(f.label);
    if(f.managed){ futAddMgd+=f.va; futMgd.push({label:f.label,va:f.va}); }
    else { futAddNonMgd+=f.va; futNon.push({label:f.label,va:f.va}); } }});
  const futFloorA = floorA + futAddNonMgd/V;
  // future-ready rating
  let fr; if(futFloorA<=setA*0.85)fr="Strong"; else if(futFloorA<=setA)fr="Moderate"; else fr="Limited";
  return {V,service,setA,pct:PCT,
    edition:EDITION,method:METHOD,rows:E.rows,rawConnectedVA,
    generalConnVA,genDemVA,hvacVA,managedContinuousVA,contSubVA,cont25,unitTotalVA,
    calcA,floorA,holdsService,emsDoesWork,floorOK,overService,
    futList,futNon,futMgd,futAddNonMgd,futAddMgd,futFloorA,fr,
    kw:x=>x/1000};
}
function analyze(){
  const list = MODE==="compare"?[0,1]:[ACTIVE];
  const plans = list.map(i=>({plan:PLANS[i],c:calc(PLANS[i]),role:MODE==="compare"?(i===0?"Smallest":"Largest"):"Plan"}));
  // MF rollup
  let multi=null;
  if(MODE==="multi"){
    const P=PLANS[ACTIVE];
    multi=panelFindings(P,plans[0].c);
    multi.aduMode=P.aduMode||null;
  }
  return {plans,multi};
}

/* =====================================================================
   MULTI-PANEL  (additive — the dwelling calculation engine is unchanged)

   Two DIFFERENT things are tracked and must never be conflated:
     1. WHOLE-SERVICE CALCULATION  = calc(plan) over the full load list.
        One dwelling, one calculation. NOT two dwelling calcs added together.
     2. PANEL DISTRIBUTION         = connected/assigned load per panel.
        Used for utilisation and balance only. It is NOT a demand calculation
        and is never presented as one.
   ===================================================================== */
const PANEL_DEFAULT=()=>([
  {id:"A",name:"Panel A",rating:200,span:true},
  {id:"B",name:"Panel B",rating:200,span:true}   /* Smart Panel is the standard on both;
                                                    a traditional load centre is optional */
]);
/* ADU metering treatment.
   CA Gov. Code 65852.2 generally prevents an agency requiring a separate ADU
   utility connection/meter, EXCEPT where the ADU is built with a new
   single-family dwelling. Individual utilities differ in practice (separate
   meters have been required for new/detached ADUs by some CA utilities), and a
   JADU (<500 sf, inside the existing dwelling) rides on the main service.
   Utility/AHJ specific -> always Verification Required, never auto-applied. */
const ADU_MODES={
  sub:{label:"ADU on a subpanel (shared service)",
       note:"ADU fed from the main service \u2014 breaker or feed-through lugs off the main panel. Load is part of the whole-dwelling calculation. Feeding it through a managed panel allows the ADU branch to be monitored and curtailed.",
       sameService:true},
  meter:{label:"ADU separately metered",
       note:"Separate meter/service for the ADU. The ADU load is then NOT part of the primary dwelling calculation and is calculated on its own service. Separate-meter requirements are utility and jurisdiction specific.",
       sameService:false}
};
function panelsOf(plan){ if(!plan.panels)plan.panels=PANEL_DEFAULT(); return plan.panels; }
function panelSetpointA(pn){ return pn.span ? pn.rating*(PCT/100) : null; }
/* Panel architecture that suits a given service: 300A -> two 150A panels,
   600A -> three 200A panels, everything else -> the standard two 200A panels.
   Applied automatically in multi-panel mode until the user customises panels
   (adds/removes one or changes a rating), after which their layout is kept. */
function defaultPanelsFor(service){
  if(service===600) return [
    {id:"A",name:"Panel A",rating:200,span:true},
    {id:"B",name:"Panel B",rating:200,span:true},
    {id:"C",name:"Panel C",rating:200,span:true}];
  if(service===300) return [
    {id:"A",name:"Panel A",rating:150,span:true},
    {id:"B",name:"Panel B",rating:150,span:true}];
  return PANEL_DEFAULT();
}
function nextPanelId(pans){ const used=new Set(pans.map(p=>p.id));
  for(let c=65;c<91;c++){ const L=String.fromCharCode(c); if(!used.has(L))return L; }
  return "P"+(pans.length+1); }
function addPanel(){ touch(); const P=PLANS[ACTIVE], pans=panelsOf(P); const id=nextPanelId(pans);
  pans.push({id,name:"Panel "+id,kind:"span",model:"main40",rating:200,span:true,parent:""}); P.panelsCustom=true;
  seedPanelAssignment(P); balanceFutureLoads(P); renderPanels(); renderRows(); refresh(); }
function removePanel(i){ touch(); const P=PLANS[ACTIVE], pans=panelsOf(P); if(pans.length<=1)return;
  const gone=pans[i].id; pans.splice(i,1); const fb=pans[0].id;
  P.loads.forEach(r=>{ if((r.panel||"A")===gone) r.panel=fb; });
  if(P.futurePanel) Object.keys(P.futurePanel).forEach(k=>{ if(P.futurePanel[k]===gone) P.futurePanel[k]=fb; });
  P.panelsCustom=true; renderPanels(); renderRows(); refresh(); }
function autoArchPanels(plan){
  const want=defaultPanelsFor(plan.service), cur=plan.panels||[];
  const same=cur.length===want.length && want.every((w,i)=>cur[i]&&cur[i].rating===w.rating);
  if(same)return;
  plan.panels=want; seedPanelAssignment(plan); balanceFutureLoads(plan);
}

/* connected (assigned) load per panel — NOT a demand calculation */
function panelDistribution(plan){
  const pans=panelsOf(plan);
  const out=pans.map(pn=>({...pn, setA:panelSetpointA(pn),
    connVA:0, mgdVA:0, nonMgdVA:0, count:0, futVA:0, futMgdVA:0, futNonVA:0, futLabels:[]}));
  const byId=id=>out.find(o=>o.id===id)||out[0];
  plan.loads.forEach(r=>{
    const va=r.qty*r.va; if(va<=0)return;
    const t=byId(r.panel||"A");
    t.connVA+=va; t.count+=1;
    if(r.managed)t.mgdVA+=va; else t.nonMgdVA+=va;
  });
  /* modelled future loads, assigned per panel (scenario only, never a formal load) */
  FUTURE.forEach(f=>{
    if(!plan.future[f.id])return;
    const t=byId((plan.futurePanel&&plan.futurePanel[f.id])||"A");
    t.futVA+=f.va; t.futLabels.push(f.label);
    if(f.managed)t.futMgdVA+=f.va; else t.futNonVA+=f.va;
  });
  out.forEach(o=>{
    o.connA=o.connVA/240; o.mgdA=o.mgdVA/240; o.nonMgdA=o.nonMgdVA/240;
    o.futA=o.futVA/240; o.futNonA=o.futNonVA/240; o.futMgdA=o.futMgdVA/240;
    o.util=o.rating>0?o.connA/o.rating:0;
    o.futUtil=o.rating>0?(o.connA+o.futNonA)/o.rating:0;   /* managed future absorbed */
    o.availA=o.rating-o.connA;
    o.overRating=o.connA>o.rating;
    o.overSet=o.setA!==null && o.nonMgdA>o.setA;           /* PowerUp cannot hold */
  });
  return out;
}
/* service-level view for a multi-panel architecture */
function serviceView(plan,c){
  const pans=panelDistribution(plan);
  const svc=plan.service;
  /* each managed panel is held to its own setpoint; unmanaged panels stand at rating */
  const managedCeilA=pans.reduce((t,o)=>t+(o.setA!==null?o.setA:o.rating),0);
  const sumConnA=pans.reduce((t,o)=>t+o.connA,0);
  return {panels:pans, service:svc, managedCeilA, sumConnA,
    calcA:c.calcA,                       /* whole-dwelling calculated demand */
    overService:c.calcA>svc,
    ceilFitsService:managedCeilA<=svc,
    spare:svc-c.calcA};
}
/* Balance / distribution findings — distinguish distribution from capacity */
function panelFindings(plan,c){
  const v=serviceView(plan,c), pans=v.panels, f=[];
  if(pans.length<2)return {view:v,findings:f};
  const hi=pans.reduce((a,b)=>b.util>a.util?b:a);
  const lo=pans.reduce((a,b)=>b.util<a.util?b:a);
  const gap=(hi.util-lo.util)*100;
  if(gap>=20 && hi.availA<lo.availA)
    f.push(["redistribute",`Panel Redistribution Recommended`,
      `${hi.name} is at ${Math.round(hi.util*100)}% of its ${hi.rating}A rating while ${lo.name} is at ${Math.round(lo.util*100)}%. Roughly ${Math.round(lo.availA)}A of assigned-load capacity is available on ${lo.name}. Review circuit distribution before evaluating a larger service.`]);
  pans.forEach(o=>{
    if(o.overRating)
      f.push(["panel",`${o.name} exceeds its panel rating`,
        `Assigned connected load ${Math.round(o.connA)}A against a ${o.rating}A panel. This is a panel-level constraint, not necessarily a service-level one \u2014 confirm distribution and demand with the engineer of record.`]);
    else if(o.util>=0.8)
      f.push(["panel",`${o.name} is near its design limit`,
        `Assigned connected load is ${Math.round(o.util*100)}% of the ${o.rating}A panel.`]);
    if(o.overSet)
      f.push(["managed",`${o.name}: non-managed load exceeds the PowerUp setpoint`,
        `${Math.round(o.nonMgdA)}A of non-manageable load against a ${Math.round(o.setA)}A setpoint. Load management alone cannot hold this panel.`]);
    if(o.futNonA>0 && o.futUtil>1)
      f.push(["future",`Future scenario exceeds ${o.name}`,
        `Modelled future loads take ${o.name} to ${Math.round((o.connA+o.futNonA))}A against ${o.rating}A. Reassign the future load to the other panel or manage it.`]);
  });
  if(v.overService)
    f.push(["service",`Whole-service calculated demand exceeds the service`,
      `${Math.ceil(v.calcA)}A calculated against a ${v.service}A service. This is a service-level finding \u2014 panel redistribution will not resolve it.`]);
  else if(pans.every(o=>!o.overRating) && gap<20)
    f.push(["ok",`Distribution appears balanced`,
      `All panels are within rating and within ${Math.round(gap)} points of each other; whole-service demand is ${Math.ceil(v.calcA)}A against ${v.service}A.`]);
  return {view:v,findings:f};
}
/* Balance modelled future loads across panels — the goal on any system.
   Greedy: largest future load first, onto whichever panel is least loaded. */
function balanceFutureLoads(plan){
  const pans=panelsOf(plan);
  const load={}; pans.forEach(pn=>load[pn.id]=0);
  plan.loads.forEach(r=>{const va=r.qty*r.va; if(va>0)load[r.panel||"A"]=(load[r.panel||"A"]||0)+va;});
  plan.futurePanel=plan.futurePanel||{};
  /* honour any panel the user set by hand, then balance the rest around it */
  FUTURE.filter(f=>plan.future[f.id]&&f.va>0&&plan.futureManual&&plan.futureManual[f.id])
    .forEach(f=>{ const id=plan.futurePanel[f.id]; if(id!==undefined)load[id]=(load[id]||0)+f.va; });
  FUTURE.filter(f=>plan.future[f.id]&&f.va>0&&!(plan.futureManual&&plan.futureManual[f.id]))
    .sort((a,b)=>b.va-a.va)
    .forEach(f=>{
      let best=pans[0].id, bestPct=Infinity;
      pans.forEach(pn=>{const pct=(load[pn.id]||0)/240/pn.rating; if(pct<bestPct){bestPct=pct;best=pn.id;}});
      plan.futurePanel[f.id]=best;
      load[best]=(load[best]||0)+f.va;
    });
  return plan.futurePanel;
}
/* seed panel assignment for existing loads (editable in the UI) */
function seedPanelAssignment(plan){
  const pans=panelsOf(plan);
  const load={}; pans.forEach(pn=>load[pn.id]=0);
  const unassigned=plan.loads.filter(r=>!r.panel&&r.qty*r.va>0).sort((a,b)=>b.qty*b.va-a.qty*a.va);
  plan.loads.filter(r=>r.panel).forEach(r=>load[r.panel]=(load[r.panel]||0)+r.qty*r.va);
  unassigned.forEach(r=>{
    let best=pans[0].id,bestPct=Infinity;
    pans.forEach(pn=>{const pct=(load[pn.id]||0)/240/pn.rating; if(pct<bestPct){bestPct=pct;best=pn.id;}});
    r.panel=best; load[best]+=r.qty*r.va;
  });
  plan.loads.filter(r=>!r.panel).forEach(r=>r.panel=pans[0].id);
  return plan.loads;
}

const rA=x=>Math.round(x)+"A";
const cA=x=>Math.ceil(x)+"A";
const kw=x=>(x/1000).toFixed(2);
/* Amperage-first label: operating amps (nameplate VA / voltage) as the primary
   number, kW underneath. Deliberately NOT the breaker rating — a 48A EVSE on a

   storage / Tech Services load cards. */
function opAmps(va,volts){ return va/(volts||240); }

function spanClass(c){

  const hasMgd=c.managedContinuousVA>0;

/* =======================================================

function niceTicks(maxA,service){
  const t=new Set([0,service]);
  const step = maxA<=160?40 : maxA<=320?50 : 100;
  for(let v=step; v<maxA; v+=step) if(Math.abs(v-service)>step*0.35) t.add(v);
  return [...t].filter(v=>v<=maxA).sort((a,b)=>a-b);
}
/* Two conditions per plan: Without Energy Management vs With SPAN PowerUp.
   PowerUp does NOT delete managed load — it is drawn as a controlled (dashed) band
   held under the setpoint, with any excess shown as time-shifted, not removed. */
function capacityChartSVG(cols, service, setA){
  const calcs=cols.map(x=>x.c.calcA);
  const maxA=Math.max(service*1.32, Math.max(...calcs)*1.16);

  const grp=(W-padL-padR)/cols.length, bw=Math.min(64,grp*0.30), gap=10;
  let s=`<svg class="cap" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<defs><pattern id="mgdhatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#FFF3E0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#FF9500" stroke-width="2.5"/></pattern></defs>`;
  niceTicks(maxA,service).forEach(v=>{const yy=y(v);
    s+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#EEE"/>`;
    s+=`<text x="${padL-6}" y="${yy+3}" text-anchor="end" font-size="9" fill="#9AA0A0">${v}</text>`;});
  /* service + setpoint reference lines */
  s+=`<line x1="${padL}" y1="${y(service)}" x2="${W-padR}" y2="${y(service)}" stroke="#141414" stroke-width="1.6" stroke-dasharray="5 3"/>`;
  s+=`<text x="${W-padR}" y="${y(service)-4}" text-anchor="end" font-size="10" font-weight="700" fill="#141414">${service}A service</text>`;
  s+=`<line x1="${padL}" y1="${y(setA)}" x2="${W-padR}" y2="${y(setA)}" stroke="#0CB560" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  s+=`<text x="${W-padR}" y="${y(setA)+11}" text-anchor="end" font-size="10" font-weight="700" fill="#0a9a52">${Math.round(setA)}A setpoint</text>`;
  cols.forEach((b,i)=>{
    const c=b.c, gx=padL+grp*i+grp/2;
    const xA=gx-bw-gap/2, xB=gx+gap/2;
    /* ---- A: without energy management (full calculated load) ---- */
    let acc=0;
    [["gen",c.genDemVA/240],["hvac",c.hvacVA/240],["cont",c.contSubVA/240]].forEach(([k,a])=>{
      const y0=y(acc),y1=y(acc+a); if(a>0.4)s+=`<rect class="s${k}" x="${xA}" y="${y1}" width="${bw}" height="${(y0-y1).toFixed(1)}"/>`; acc+=a;});
    if(c.calcA>service){const yT=y(c.calcA),yS=y(service);
      s+=`<rect class="sover" x="${xA}" y="${yT}" width="${bw}" height="${(yS-yT).toFixed(1)}"/>`;
      s+=`<line x1="${xA}" y1="${yT}" x2="${xA+bw}" y2="${yT}" stroke="#F72A63" stroke-width="2"/>`;}
    s+=`<text x="${xA+bw/2}" y="${y(c.calcA)-6}" text-anchor="middle" font-size="12" font-weight="700" fill="${c.calcA>service?'#F72A63':'#141414'}">${Math.ceil(c.calcA)}A</text>`;
    s+=`<text x="${xA+bw/2}" y="${baseY+13}" text-anchor="middle" font-size="8.5" fill="#666">without EM</text>`;
    /* ---- B: with SPAN PowerUp ---- */
    const floor=c.floorA, mgd=Math.max(0,c.calcA-c.floorA);
    const cap=Math.min(setA,c.calcA);                 /* controlled ceiling */
    const inBand=Math.max(0,cap-floor);               /* managed load running under setpoint */
    const shifted=Math.max(0,mgd-inBand);             /* managed load time-shifted, NOT removed */
    /* non-managed floor solid */
    let acc2=0;
    const fGen=Math.min(floor,c.genDemVA/240), fHv=Math.max(0,floor-fGen);
    [["gen",fGen],["hvac",fHv]].forEach(([k,a])=>{const y0=y(acc2),y1=y(acc2+a);
      if(a>0.4)s+=`<rect class="s${k}" x="${xB}" y="${y1}" width="${bw}" height="${(y0-y1).toFixed(1)}"/>`; acc2+=a;});
    /* managed band held under the setpoint (hatched = actively controlled) */
    if(inBand>0.4){const y0=y(floor),y1=y(floor+inBand);
      s+=`<rect x="${xB}" y="${y1}" width="${bw}" height="${(y0-y1).toFixed(1)}" fill="url(#mgdhatch)" stroke="#FF9500" stroke-width="1"/>`;}
    /* Managed load that exceeds the in-band headroom is deferred, not removed.
       Shown as a compact chevron + label above the capped bar rather than a
       floating dashed box (which read as clutter over the service line). */
    if(shifted>0.4){
      /* labelled below the bar so it never collides with the reference lines */
      s+=`<text x="${xB+bw/2}" y="${baseY+25}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c47600">\u2193 ${Math.round(shifted)}A deferred</text>`;}
    s+=`<line x1="${xB}" y1="${y(cap)}" x2="${xB+bw}" y2="${y(cap)}" stroke="#0CB560" stroke-width="2.4"/>`;
    s+=`<text x="${xB+bw/2}" y="${y(cap)-6}" text-anchor="middle" font-size="12" font-weight="700" fill="#0a9a52">${Math.round(cap)}A</text>`;
    s+=`<text x="${xB+bw/2}" y="${baseY+13}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0a9a52">with PowerUp</text>`;
    s+=`<text x="${gx}" y="${baseY+42}" text-anchor="middle" font-size="10" fill="#333">${b.label.split(":")[0]}</text>`;
  });
  s+=`</svg>`;
  return s;
}
/* ---- Future headroom gauge: what each Possible Tomorrow load costs ----
   The bar IS the setpoint. Non-managed future loads consume headroom;
   PowerUp-manageable future loads are absorbed and cost none. */
function futureHeadroomSVG(cols){
  const anySel=cols.some(x=>x.c.futList.length>0);
  if(!anySel) return `<div class="nofut">Select loads under <b>Possible Tomorrow</b> to model what each one costs against the PowerUp setpoint.</div>`;
  const rowH=70, W=660, padL=124, padR=86;
  const H=8+cols.length*rowH+8, trackW=W-padL-padR;
  let s=`<svg class="cap" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  cols.forEach((b,i)=>{
    const c=b.c, setp=c.setA, floor=c.floorA;
    const nf=floor+c.futAddNonMgd/240;
    const span=Math.max(setp, nf*1.04), sc=trackW/span;
    const yy=14+i*rowH, bh=25;
    s+=`<text x="0" y="${yy+15}" font-size="11" font-weight="700" fill="#333">${b.role}</text>`;
    s+=`<text x="0" y="${yy+28}" font-size="8.5" fill="#6F7070">floor ${Math.round(floor)}A of ${Math.round(setp)}A</text>`;
    s+=`<rect class="strack" x="${padL}" y="${yy}" width="${trackW}" height="${bh}" rx="4"/>`;
    s+=`<rect class="sgen" x="${padL}" y="${yy}" width="${(floor*sc).toFixed(1)}" height="${bh}" rx="4"/>`;
    let x=padL+floor*sc;
    c.futNon.forEach(f=>{
      const wid=(f.va/240)*sc;
      s+=`<rect class="sfut" x="${x.toFixed(1)}" y="${yy}" width="${wid.toFixed(1)}" height="${bh}" stroke="#00B0D3" stroke-width="1" stroke-dasharray="3 2"/>`;
      x+=wid;});
    const rem=setp-nf;
    if(rem>=0){
      s+=`<rect class="srem" x="${x.toFixed(1)}" y="${yy}" width="${(rem*sc).toFixed(1)}" height="${bh}"/>`;
      if(rem*sc>44)s+=`<text x="${(x+rem*sc/2).toFixed(1)}" y="${yy+17}" text-anchor="middle" font-size="9" font-weight="700" fill="#0a9a52">${Math.round(rem)}A left</text>`;
    } else {
      const ox=padL+setp*sc, ow=(nf-setp)*sc;
      s+=`<rect class="sover" x="${ox.toFixed(1)}" y="${yy}" width="${ow.toFixed(1)}" height="${bh}" stroke="#F72A63" stroke-width="1"/>`;
      s+=`<text x="${(ox+ow+6).toFixed(1)}" y="${yy+17}" font-size="9" font-weight="700" fill="#F72A63">+${Math.round(-rem)}A over</text>`;
    }
    if(c.futNon.length){
      s+=`<text x="${padL}" y="${yy+bh+13}" font-size="8" fill="#00819c">Consumes headroom: ${c.futNon.map(f=>f.label+" "+Math.round(f.va/240)+"A").join("  \u00b7  ")}</text>`;
    } else {
      s+=`<text x="${padL}" y="${yy+bh+13}" font-size="8" fill="#9AA0A0">No Possible Tomorrow loads selected for this plan</text>`;
    }
    s+=`<line x1="${(padL+setp*sc).toFixed(1)}" y1="${yy-5}" x2="${(padL+setp*sc).toFixed(1)}" y2="${yy+bh+5}" stroke="#0CB560" stroke-width="2"/>`;
    s+=`<text x="${(padL+setp*sc).toFixed(1)}" y="${yy-9}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0a9a52">${Math.round(setp)}A setpoint</text>`;
  });
  s+=`</svg>`;
  const mgd=cols[cols.length-1].c.futMgd;
  if(mgd.length){
    s+=`<div class="chips"><span class="chl">Absorbed by PowerUp \u2014 no headroom cost:</span>`
      + mgd.map(f=>`<span class="chip">${f.label} ${Math.round(f.va/240)}A</span>`).join("")+`</div>`;
  }
  const nonTot=cols[cols.length-1].c.futAddNonMgd, mgdTot=cols[cols.length-1].c.futAddMgd;
  if(mgdTot>0||nonTot>0){
    s+=`<div class="futnote"><b>${Math.round(mgdTot/240)}A</b> of future load is manageable and costs no headroom; <b>${Math.round(nonTot/240)}A</b> is not manageable and comes straight off the setpoint. Which options a builder offers matters more than how many.</div>`;
  }
  return s;
}
/* ---- Multi-panel vertical chart -------------------------------------------

function multiPanelChartSVG(view,c){

  pans.forEach((o,i)=>{

      s+=`<rect ${fill?`fill="${fill}" stroke="#FF9500" stroke-width="1"`:`class="${cls}"`} x="${x}" y="${y1}" width="${bw}" height="${(y0-y1).toFixed(1)}"/>`; acc+=a; };
    seg(o.nonMgdA,"sgen");
    seg(o.mgdA,null,"url(#mgdhatch2)");
    if(o.futNonA>0.4){const y0=y(acc),y1=y(acc+o.futNonA);
      s+=`<rect class="sfut" x="${x}" y="${y1}" width="${bw}" height="${(y0-y1).toFixed(1)}" stroke="#00B0D3" stroke-width="1" stroke-dasharray="3 2"/>`;}
    const top=o.connA+o.futNonA;
    s+=`<text x="${gx}" y="${y(top)-6}" text-anchor="middle" font-size="12" font-weight="700" fill="${o.connA>o.rating?"#F72A63":"#141414"}">${Math.round(o.connA)}A</text>`;
    s+=`<text x="${gx}" y="${baseY+14}" text-anchor="middle" font-size="10" font-weight="700" fill="#333">${o.name}</text>`;
    s+=`<text x="${gx}" y="${baseY+26}" text-anchor="middle" font-size="8" fill="#666">${o.span?"Smart Panel":"traditional"} \u00b7 assigned</text>`;
  });
  const i=pans.length, gx=padL+gw*i+gw/2, x=gx-bw/2, x0=padL+gw*i+6, x1=W-padR;
  s+=`<line x1="${x0}" y1="${y(svc)}" x2="${x1}" y2="${y(svc)}" stroke="#141414" stroke-width="2" stroke-dasharray="6 3"/>`;

  s+=`<line x1="${x0}" y1="${y(ceil)}" x2="${x1}" y2="${y(ceil)}" stroke="#0CB560" stroke-width="2" stroke-dasharray="4 3"/>`;
  s+=`<text x="${x0}" y="${y(ceil)+12}" font-size="9" font-weight="700" fill="#0a9a52">${Math.round(ceil)}A ceiling = ${pans.map(o=>o.setA!==null?Math.round(o.setA):o.rating).join(" + ")}</text>`;

  s+=`<text x="${gx}" y="${baseY+26}" text-anchor="middle" font-size="8" fill="#666">calculated demand</text>`;
  s+=`</svg>`;
  return s;

/* ---- Multi-panel: one compact bar per panel (assigned load, future, rating) ---- */
function panelChartSVG(o){

/* ---- PowerUp numbers panel ---- */

  const mgdLoads=[];
  worst.plan.loads.forEach(r=>{ if(r.managed&&r.qty*r.va>0)mgdLoads.push([r.desc,r.qty*r.va]); });
  return `<div class="pugrid">
    <div class="pucard noem"><h4>Without energy management</h4><div class="n">${cA(c.calcA)}</div>
      <div class="sm">Calculated dwelling load, ${methodName()}. ${c.calcA>service?`Exceeds the ${rA(service)} service by ${Math.ceil(c.calcA-service)} A.`:`Within the ${rA(service)} service.`}</div></div>
    <div class="pucard withpu"><h4>With SPAN PowerUp\u2122</h4><div class="n">${rA(Math.min(setA,c.calcA))}</div>
      <div class="sm">Demand held under the ${rA(setA)} setpoint (${Math.round(c.pct)}% of ${rA(service)}). The managed load is still connected and still served \u2014 it is controlled, not removed.</div></div>
    <div class="pucard verdict"><h4>Management capacity</h4>
      <div class="li"><span>Non-managed floor</span><b>${rA(c.floorA)}</b></div>
      <div class="li"><span>Available for management</span><b>${rA(mgdA)}</b></div>
      <div class="li"><span>Headroom under setpoint</span><b>${head>=0?"+":""}${head.toFixed(0)} A</b></div>
      <div class="puverd ${capable?"ok":"no"}">${capable
        ? "Appears capable of operating within the configured setpoint."
        : "Does NOT appear capable \u2014 non-managed load alone exceeds the setpoint."}</div></div>
  </div>
  ${mgdLoads.length?`<div class="sm" style="font-size:11.5px;color:var(--grey);margin-top:8px">Loads selected for management (${worst.role.toLowerCase()} plan): ${mgdLoads.map(m=>m[0]+" ("+m[1].toLocaleString()+" VA)").join(" · ")}</div>`:`<div class="sm" style="font-size:11.5px;color:var(--grey);margin-top:8px">No loads are currently selected for management.</div>`}
  <div class="pumech"><b>How it works.</b> As demand approaches the ${rA(setA)} setpoint, PowerUp defers the enrolled loads, then restores them automatically. Cooking, dryer, refrigeration and lighting are never curtailed.</div>
  <div class="illus">Final applicability requires project-specific load calculations, equipment data, applicable NEC provisions, utility requirements, local amendments, and AHJ approval.</div>`;
}

function renderBrief(A){
  if(projectEmpty(A)){ $("outBrief").innerHTML=emptyStateHTML("brief"); return; }
  const st=STATES[$("state").value]||{}, nec=st.nec||"\u2014";
  const builder=$("builder").value, homes=nInt($("homes").value);
  const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const largest=A.plans[A.plans.length-1], sc0=spanClass(largest.c);
  const anyOver=A.plans.some(p=>p.c.overService);
  const anyBust=A.plans.some(p=>!p.c.floorOK);
  const calcN=cA(largest.c.calcA);
  const pc=PITCHC[st.pitch]||"#6F7070";
  const block=(cls,h,body)=>`<div class="block ${cls}"><h3>${h}</h3>${body}</div>`;

  /* ---- multi-panel context, when that is the review ---- */
  const M=A.multi||null;
  let hi=null,lo=null,gap=0,panelOver=false;
  if(M){ const ps=M.view.panels;
    hi=ps.reduce((a,b)=>b.util>a.util?b:a); lo=ps.reduce((a,b)=>b.util<a.util?b:a);
    gap=(hi.util-lo.util)*100; panelOver=ps.some(o=>o.overRating); }

  /* ---- 1. Executive Read ---- */
  const execRead = M
    ? (M.view.overService
        ? `Whole-service demand is ${cA(M.view.calcA)} against the ${M.view.service}A service. That is a service-level constraint, not a distribution one \u2014 lead with the design fix, not with product.`
        : (panelOver||gap>=20)
          ? `The ${M.view.service}A architecture carries the load, but it is unevenly split: ${hi.name} at ${Math.round(hi.util*100)}% versus ${lo.name} at ${Math.round(lo.util*100)}%. The real question on the table is distribution, not service size.`
          : `${M.view.service}A across ${M.view.panels.map(o=>o.rating+"A").join(" + ")} carries the design at ${cA(M.view.calcA)} with ${Math.floor(M.view.spare)}A of headroom and both panels inside rating. Nothing in this data points to a larger service.`)
    : anyBust
      ? `The ${largest.role.toLowerCase()} plan's non-managed load exceeds the setpoint. Lead with the fix, not the win \u2014 claiming management holds it would not survive an engineer's review.`
      : anyOver
        ? `Largest plan calculates to ${calcN} on a ${rA(largest.c.service)} panel. Clean avoidance story across ${homes.toLocaleString()} homes. Verdict: ${sc0.label}.`
        : `No forced upsize on these plans. The value here is optionality and future headroom, not capacity relief. Verdict: ${sc0.label} \u2014 do not oversell a problem that is not there.`;

  /* ---- 2. Why It Matters ---- */
  const why = M
    ? (M.view.overService
        ? `A larger service means new gear, new trenching and a utility conversation. Getting the calculation right first protects the schedule and the budget.`
        : (panelOver||gap>=20)
          ? `Rebalancing circuits is a drawing change. A service upgrade is gear, labour, utility coordination and schedule. Those are not comparable costs, and right now the data points at the cheaper one.`
          : `Standardising this architecture means one design across the portfolio, and the homeowner keeps room for options later without touching the service.`)
    : anyOver
      ? `One service strategy instead of a mixed 320/400A spread: the builder standardises gear, the EC quotes one design, and each home keeps room to sell options \u2014 across ${homes.toLocaleString()} doors.`
      : `Differentiation and future flexibility rather than cost avoidance. The homeowner can electrify further without a service change, and the builder can offer options that competitors cannot.`;

  /* ---- 3. Key Insight ---- */
  const insight = M
    ? `A panel that is out of room is not the same as a service that is out of capacity. ${hi?`${hi.name} is at ${Math.round(hi.util*100)}% while ${lo.name} sits at ${Math.round(lo.util*100)}% \u2014 that is a distribution question. `:""}Most upgrade quotes never separate the two, so the larger service gets priced by default.`
    : anyOver
      ? `The panel label is not the service size \u2014 the calculation is. Fully optioned, this plan already calculates to ${calcN}, and it crossed the line the moment the options the builder wants to sell were added.`
      : `The loads that make builders nervous about electrification \u2014 EV charging, heat-pump water heating, HVAC \u2014 are the same loads that can be managed. The panel does not just monitor; it holds the service.`;

  /* ---- 4. Conversation Angle ---- */
  const angle = M
    ? `Ask what the upgrade quote assumes. If the answer is "we were told we need 600A," the useful next move is to look at where the load actually sits before anyone prices gear. Frame it as protecting their budget, not defending a product.`
    : anyOver
      ? `Open with what most production lots start as, then show what this plan actually calculates to. Let the number make the argument; the panel is the answer to a problem they can see, not the opening pitch.`
      : `Do not manufacture a capacity problem. Anchor on what they can sell later on the service they are already installing, and let them decide whether optionality is worth it.`;

  /* ---- 5. Evidence ---- */
  const evidence = `<ul>
    <li><b>Calculation:</b> ${A.plans.map(p=>`${p.role} ${cA(p.c.calcA)}`).join(", ")} against ${rA(largest.c.service)}${M?" service, "+M.view.panels.map(o=>o.name+" "+Math.round(o.connA)+"A/"+o.rating+"A").join(", "):""} \u2014 ${methodName()}, ${R().label}.</li>
    <li><b>Setpoint basis:</b> ${Math.round(largest.c.pct)}% of service per ${emsCite(nec)}${pcsAvail(nec)?"; PCS "+R().pcs+" also available in this edition":""}.</li>
    <li><b>Non-managed floor:</b> ${rA(largest.c.floorA)}${largest.c.floorOK?" \u2014 under the setpoint, so management genuinely holds":" \u2014 above the setpoint, so management alone does not hold"}.</li>
    <li><b>Equipment:</b> service-entrance-rated Smart Panel, 225A busbar / 200A max main, 48 controllable positions, UL 916 EMS and UL 3141 PCS.</li>
  </ul>`;

  /* ---- 6. Likely Pushback (only relevant stakeholders) ---- */
  let push=[];
  push.push(`<li><b>AHJ:</b> will the setpoint be accepted as the service-sizing line item? ${pcsAvail(nec)?"("+R().pcs+" PCS helps in this edition.)":"(Pre-2023 edition \u2014 rests on "+R().ems+".)"}</li>`);
  if(M) push.push(`<li><b>Engineer:</b> panel loading versus whole-dwelling calculation \u2014 expect the two to be conflated. Concede the distinction before it is raised.</li>`);
  else push.push(`<li><b>Engineer:</b> connected versus managed load. The non-managed floor is the real constraint; show it rather than avoid it.</li>`);
  push.push(`<li><b>EC:</b> is this more labour? One panel, feed-through lugs, standard plug-on breakers, one commissioning step.</li>`);
  if(anyOver||M) push.push(`<li><b>Purchasing:</b> why not just upsize? Because the upgrade is gear plus labour plus utility, and the data does not require it.</li>`);

  /* ---- 7. Response ---- */
  const response = M
    ? `Separate the two levels out loud: whole-service demand is ${cA(M.view.calcA)} against ${M.view.service}A, and the panel figures are assigned connected load for distribution review only. Never add the panels together to produce a service number \u2014 an engineer will catch it and the credibility goes with it.`
    : `Take the calculation and the ${emsCite(nec)} language to the AHJ early and submit the setpoint as a single line item with the UL listing. To the EC: same box count or fewer. To the engineer: concede the non-managed floor openly \u2014 it is ${rA(largest.c.floorA)} here${largest.c.floorOK?", comfortably under the setpoint":" and needs a design decision"}.`;

  /* ---- 8. Questions to Ask ---- */
  let qs=[];
  if(M){
    qs.push("What does the existing upgrade quote assume, and who produced it?");
    qs.push("Are the panel schedules final, or is circuit distribution still open?");
    qs.push("Is the second panel already located, and how is it fed?");
  } else {
    qs.push("What are you speccing today \u2014 service size, panel, circuit count, inside or outside?");
    qs.push("Which options do you actually sell, and which do you want to?");
  }
  qs.push("Who is the EC, and what is driving the electrical scope?");
  qs.push("Has any AHJ or utility in this market already accepted a managed setpoint?");

  /* ---- 9. Who Needs to Be Involved ---- */
  const who = M
    ? `<b>Engineer of record</b> first \u2014 the distribution question is theirs to confirm. Then the <b>EC</b> on circuit routing, and the <b>builder</b> on whether the upgrade budget can be released. Utility and AHJ only once the architecture is settled.`
    : `<b>Builder</b> on standardisation and options, <b>purchasing</b> on one SKU across the range, <b>EC and MEP</b> to defend the setpoint and the non-managed floor, then <b>utility and AHJ</b> to accept the line item.${st.pitch==="HIGH"||st.pitch==="HIGHEST"?" Sustainability or marketing is a warm entry in this market.":" Weak policy tailwind here \u2014 lead with the engineering, not the mandate."}`;

  /* ---- 10. Recommended Next Move ---- */
  const nextMove = M
    ? (M.view.overService
        ? `Get the load calculation in front of the engineer of record this week. Do not position SPAN until the service question is settled.`
        : `Propose a short distribution review with the EC and engineer before the upgrade is priced. One meeting, one drawing markup.`)
    : anyOver
      ? `Walk in pre-built: largest optioned plan, show the ${calcN}, then the held service. Ask for the design review session on the spot.`
      : `Ask which options they want to offer in the next 12 months, and scope the review around that rather than around capacity.`;

  /* ---- 11. Risk / Watchout ---- */
  let risks=[];
  if(anyBust) risks.push(`<b>Real risk:</b> non-managed load (${rA(largest.c.floorA)}) exceeds the setpoint (${rA(largest.c.setA)}). Management alone does not hold this \u2014 do not claim it does.`);
  if(M&&M.view.overService) risks.push(`The service is genuinely short. Redistribution will not fix it, and proposing it as a fix will cost credibility.`);
  if(M&&!M.view.overService&&gap<20&&!panelOver) risks.push(`Distribution is already balanced, so there is no problem to solve here. Forcing one would be transparent.`);
  if(!anyOver&&!M) risks.push(`No hard capacity constraint \u2014 an honest "enables" read can land as nice-to-have. Anchor on option value and do not invent an upgrade story.`);
  risks.push(`AHJ acceptance of the setpoint line item is the main external unknown. De-risk it with an early code conversation.`);
  risks.push(`Every figure here is preliminary and unstamped. SPAN is not the engineer of record.`);

  $("outBrief").innerHTML=`
  <section class="page ib">
    <div class="dhead">
      <div class="l"><b>INTERNAL SALES BRIEF \u2014 NOT FOR DISTRIBUTION</b>
        <div class="t">${builder}</div>
        <div class="s">${M?`${M.view.service}A \u00b7 ${M.view.panels.map(o=>o.name+" "+o.rating+"A").join(" + ")}`:A.plans.map(p=>p.role+": "+p.plan.name).join("  \u00b7  ")} \u00b7 ${$("state").value}</div>
      </div>
      <div class="r"><span class="pill int">Internal</span><br>${R().label}<br>${homes.toLocaleString()} homes \u00b7 ${date}</div>
    </div>

    <div class="pitchrow" style="margin-top:14px">
      <span class="pitchtag" style="background:${pc}">${st.pitch} market</span>
      <span style="font-size:12px;color:var(--grey)">${st.mandate} \u00b7 Driver: ${st.batt}</span>
    </div>

    ${block("","Executive Read",`<p>${execRead}</p>`)}
    ${block("","Why It Matters",`<p>${why}</p>`)}
    ${block("teach","Key Insight",`<p>${insight}</p>`)}
    ${block("tension","Conversation Angle",`<p>${angle}</p>`)}
    ${block("","Evidence",evidence)}
    <div class="foot"><span>INTERNAL \u2014 SPAN Energy Intelligence℠ sales brief</span><span>${builder}</span></div>
  </section>

  <section class="page ib">
    ${block("risk","Likely Pushback",`<ul>${push.join("")}</ul>`)}
    ${block("","Response",`<p>${response}</p>`)}
    ${block("","Questions to Ask",`<ul>${qs.map(q=>`<li>${q}</li>`).join("")}</ul>`)}
    ${block("","Who Needs to Be Involved",`<p>${who}</p>`)}
    ${block("","Recommended Next Move",`<p>${nextMove}</p>`)}
    ${block("risk","Risk / Watchout",`<ul>${risks.map(r=>`<li>${r}</li>`).join("")}</ul>`)}
    <div class="disc" style="border-top-color:var(--red)"><b>Internal use only \u2014 do not distribute to the builder, contractor, engineer, utility, or AHJ.</b> Contains commercial positioning. Technical conclusions are preliminary; SPAN is not the Engineer of Record. Share the builder-facing Design Review instead.</div>
    <div class="foot"><span>INTERNAL \u2014 SPAN Energy Intelligence℠ sales brief \u00b7 not for distribution</span><span>${builder} \u00b7 ${date}</span></div>
  </section>`;
}

/* Continuous-load flag (NEC 210.19(A)/210.20(A) branch, 215.2/215.3 feeder):
   drives the 125% conductor / OCPD SIZING figure only. It never changes the
   Part III (Standard) or 220.82 (Optional) demand total — see engines, unchanged.
   The existing EV / continuous-receptacle 125% DEMAND treatment is separate and
   stays scoped to that category. */
function contSizingA(r){ return loadAmps(r)*1.25; }
function contCell(i,r){ return `<div class="fl pwrup" style="flex:0 0 auto;text-align:center"><span>Cont</span><span class="mgd"><input type="checkbox" ${r.cont?"checked":""} title="Continuous load (operates 3+ hours). Drives 125% conductor / OCPD sizing only — not the demand total." onchange="touch();PLANS[${ACTIVE}].loads[${i}].cont=this.checked;renderRows();refresh()"></span></div>`; }
function contHint(r){ return r.cont?`<div style="font-size:9.5px;color:var(--grey);margin-top:3px">Continuous: <b>${contSizingA(r).toFixed(0)} A</b> min conductor / OCPD (125% sizing figure, not demand)</div>`:""; }
/* ---- Load classification (Phase 4): Managed / Protected / Standard ----
   Managed  = PowerUp may curtail it; leaves the non-managed floor (r.managed).
   Protected= must NOT be curtailed (life-safety, sump / ejector, freeze
              protection, primary heat, critical refrigeration); stays in the
              floor and is never a shed candidate (r.protected, non-managed).
   Standard = never managed by nature (cooking, lighting, general); stays in floor.
   The floor math keys on r.managed only, so Protected and Standard both remain in
   the floor exactly as before — this is additive and does not change any demand. */
function loadClass(r){ return r.managed?"managed":(r.protected?"protected":"standard"); }

function syncGL(){

  PLANS.forEach(P=>{const g=P.loads.find(r=>r.glauto);if(g){g.qty=P.sqft;g.va=lightingUnitVA();g.desc="General lighting + receptacles ("+lightingUnitVA()+" VA/ft\u00b2)";}});

/* Assign a newly added load to the lighter panel so it never silently piles
   onto Panel A. Only applies in multi-panel mode. */
function assignNewLoad(r){
  if(MODE!=="multi")return r;
  const P=PLANS[ACTIVE], pans=panelsOf(P), load={};
  pans.forEach(pn=>load[pn.id]=0);
  P.loads.forEach(x=>{ if(x!==r){const va=x.qty*x.va; if(va>0)load[x.panel||pans[0].id]=(load[x.panel||pans[0].id]||0)+va;} });
  let best=pans[0].id,bestPct=Infinity;
  pans.forEach(pn=>{const pct=(load[pn.id]||0)/240/pn.rating; if(pct<bestPct){bestPct=pct;best=pn.id;}});
